      <strong id="cal-month" style="min-width:130px;text-align:center"></strong>
      <button class="btn btn-outline btn-sm" onclick="calMove(1)" aria-label="Next month">›</button>
      <button class="btn btn-outline btn-sm" onclick="calMove(0)">Today</button>
      ${isHR?'':`<select id="cal-scope" onchange="calFilter()"><option value="team" ${s.scope==='team'?'selected':''}>My team</option><option value="all" ${s.scope==='all'?'selected':''}>Everyone</option></select>`}
      <select id="cal-dept" onchange="calFilter()"><option value="">All departments</option>${optionList(DEPARTMENTS, s.dept)}</select>
      <select id="cal-site" onchange="calFilter()"><option value="">All sites</option>${optionList(SITES, s.site)}</select>
    </div>
    <div class="cal-legend">
      ${chk('hol','Holiday')}${chk('sick','Sickness')}${chk('oth','Other absence')}${chk('oo','One-to-ones')}
      <span class="small muted"><span class="cal-chip cal-hol pending">H</span> pending · ½ half day · <span class="cal-chip cal-away">A</span> away · <span class="cal-chip cal-closed">BH</span> bank holiday · <span class="cal-chip cal-closed">SD</span> shutdown</span>
    </div>
    <div class="card" id="cal-body"></div>`;
  // optionList keeps the current value selected, but "" (all) must stay selected when nothing is chosen
  if (!s.dept) document.getElementById('cal-dept').value = '';
  if (!s.site) document.getElementById('cal-site').value = '';
  await drawCalendar();
}
function calMove(n){
  const s = calState();
  if (!n) s.ym = today().slice(0,7);
  else { const [y,m] = s.ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); s.ym = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
  drawCalendar();
}
function calFilter(){
  const s = calState();
  if (document.getElementById('cal-scope')) s.scope = val('cal-scope');
  s.dept = val('cal-dept'); s.site = val('cal-site');
  Object.keys(s.show).forEach(k => { const el = document.getElementById('cal-show-'+k); if (el) s.show[k] = el.checked; });
  drawCalendar();
}
function calPeople(s){
  const me = state.user.employee_id, role = state.user.role;
  let list = state.employees.filter(e=>e.status!=='leaver');
  if (role!=='hr_admin' && s.scope==='team'){
    if (role==='manager') list = list.filter(e=>e.id===me || e.manager_id===me);
    else { const mgr = empById(me)?.manager_id; list = list.filter(e=>e.id===me || (mgr && (e.manager_id===mgr || e.id===mgr))); }
  }
  if (s.dept) list = list.filter(e=>e.department===s.dept);
  if (s.site) list = list.filter(e=>e.site===s.site);
  return list.sort((a,b)=>((b.id===me)-(a.id===me)) || (a.last_name||'').localeCompare(b.last_name||''));
}
function calLeaveKind(l){
  if (l.type==='adjustment' || !['approved','pending'].includes(l.status)) return null;
  const full = l.employee_id===state.user.employee_id || canManageEmp(l.employee_id);
  if (l.status==='pending' && !full) return null;
  if (l.type==='holiday') return 'hol';
  if (!full) return 'away';
  return l.type==='sickness' ? 'sick' : 'oth';
}
async function drawCalendar(){
  const s = calState();
  const body = document.getElementById('cal-body'); if (!body) return;
  const [y,m] = s.ym.split('-').map(Number);
  const nDays = new Date(y, m, 0).getDate();
  const first = `${s.ym}-01`, last = `${s.ym}-${String(nDays).padStart(2,'0')}`;
  document.getElementById('cal-month').textContent = monthLabel(s.ym);
  const people = calPeople(s), ids = new Set(people.map(e=>e.id));
  const closedMap = new Map(state.companyDays.map(c=>[c.date,c]));
  const days = Array.from({length:nDays}, (_,i) => { const ds = `${s.ym}-${String(i+1).padStart(2,'0')}`, wd = new Date(y, m-1, i+1).getDay(); return { ds, d:i+1, wd, we: wd===0||wd===6, closed: closedMap.get(ds) }; });
  const cells = {}, entries = [];
  const put = (emp, ds, x) => { cells[emp] = cells[emp]||{}; (cells[emp][ds] = cells[emp][ds]||[]).push(x); };
  const wanted = k => k==='away' ? (s.show.sick||s.show.oth) : s.show[k];
  for (const l of (await idbGetAll('leave')).filter(l => ids.has(l.employee_id) && l.start_date<=last && l.end_date>=first)){
    const kind = calLeaveKind(l);
    if (!kind || !wanted(kind)) continue;
    const label = kind==='hol' ? 'Holiday' : kind==='away' ? 'Away' : leaveLabel(l.type);
    const pending = l.status==='pending';
    const tip = `${empName(l.employee_id)} — ${label}${pending?' (pending approval)':''}${l.half_day?' (half day)':''}: ${fmtDate(l.start_date)}${l.end_date!==l.start_date?' to '+fmtDate(l.end_date):''}`;
    days.forEach(d => { if (!d.we && !d.closed && d.ds>=l.start_date && d.ds<=l.end_date) put(l.employee_id, d.ds, { kind, pending, half:l.half_day, tip }); });
    entries.push({ emp:l.employee_id, kind, label: label+(pending?' (pending)':'')+(l.half_day?' (half day)':''), from:l.start_date, to:l.end_date, days: kind==='away'?'':l.days });
  }
  if (s.show.oo){
    for (const o of (await idbGetAll('one_to_ones')).filter(o => ['scheduled','completed'].includes(o.status) && o.date>=first && o.date<=last && canSeeOneToOne(o))){
      const who = [o.employee_id, o.with_id].filter(id => id && ids.has(id));
      if (!who.length) continue;
      const tip = `One-to-one: ${empName(o.employee_id)} with ${o.with_id?empName(o.with_id):'HR'} · ${fmtDate(o.date)}${o.time?' '+o.time:''}`;
      who.forEach(id => put(id, o.date, { kind:'oo', tip }));
      entries.push({ emp:o.employee_id, kind:'oo', label:`One-to-one with ${o.with_id?empName(o.with_id):'HR'}${o.time?' at '+o.time:''}`, from:o.date, to:o.date, days:'' });
    }
  }
  // Bank holidays / shutdown days apply to everyone
  days.filter(d=>d.closed).forEach(d => entries.push({ emp:null, kind:'closed', label:`${d.closed.name} — ${d.closed.kind==='bank_holiday'?'bank holiday':d.closed.deducts?'shutdown (uses holiday)':'shutdown (free day)'}`, from:d.ds, to:d.ds, days:'' }));
  const td = today();
  const cls = d => `${d.we?' we':''}${d.closed?' closed':''}${d.ds===td?' today':''}`;
  const head = `<tr><th class="cal-name">Name</th>${days.map(d=>`<th class="cal-day${cls(d)}"${d.closed?` title="${esc(d.closed.name)}"`:''}><div>${'SMTWTFS'[d.wd]}</div><div>${d.d}</div>${d.closed?`<div class="cal-cd">${d.closed.kind==='bank_holiday'?'BH':'SD'}</div>`:''}</th>`).join('')}</tr>`;
  const rows = people.map(e => {
    const me = e.id===state.user.employee_id;
    return `<tr><td class="cal-name"><a href="#" onclick="event.preventDefault();calPerson('${e.id}')">${esc(e.first_name+' '+e.last_name)}</a>${me?' <span class="badge b-yellow">You</span>':''}<div class="small muted">${esc(e.job_title||'')}</div></td>${
      days.map(d => `<td class="cal-cell${cls(d)}">${(cells[e.id]?.[d.ds]||[]).map(x=>`<span class="cal-chip ${CAL_KINDS[x.kind].cls}${x.pending?' pending':''}" title="${esc(x.tip)}">${x.kind!=='oo'&&x.half?'½':CAL_KINDS[x.kind].ch}</span>`).join('')}</td>`).join('')
    }</tr>`;
  }).join('');
  const whoOf = x => x.emp ? empName(x.emp) : 'Everyone';
  entries.sort((a,b)=>a.from.localeCompare(b.from) || whoOf(a).localeCompare(whoOf(b)));
  body.innerHTML = (people.length ? `<div class="cal-wrap"><table class="cal-grid"><thead>${head}</thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">No one matches these filters.</div>')
    + `<div class="card-head" style="margin-top:20px"><h3>${monthLabel(s.ym)} (${entries.length})</h3></div>`
    + (entries.length ? `<div class="table-wrap"><table><thead><tr><th>Employee</th><th>What</th><th>From</th><th>To</th><th>Days</th></tr></thead><tbody>${
        entries.map(x=>`<tr><td>${x.emp?esc(empName(x.emp)):'<strong>Everyone</strong>'}</td><td><span class="cal-chip ${CAL_KINDS[x.kind].cls}">${CAL_KINDS[x.kind].ch}</span> ${esc(x.label)}</td><td>${fmtDate(x.from)}</td><td>${fmtDate(x.to)}</td><td>${x.days}</td></tr>`).join('')
      }</tbody></table></div>` : '<div class="empty small">Nothing booked this month.</div>');
}
function calPerson(id){
  if (canManageEmp(id)) employeeDetail(id);
  else orgContact(id);
}

// ═══════════════════════════════════════════════
// ONE-TO-ONES
// ═══════════════════════════════════════════════
// Requested by the employee (goes to their line manager, or HR if they have
// none) or scheduled directly by the manager / HR. Shared notes and actions
// are visible to the employee; private notes only to the manager and HR.
const ONE_TO_ONE_TYPES = ['Weekly','Monthly','Quarterly','Half year','Annual','Probation review','Formal','Informal'];
const MEETING_LOCATIONS = [...SITES, 'Microsoft Teams', 'Phone', 'Other'];
function ooStatusBadge(s){ const m={requested:['Requested','b-amber'],scheduled:['Scheduled','b-blue'],completed:['Completed','b-green'],declined:['Declined','b-red'],cancelled:['Cancelled','b-grey']}; const [t,c]=m[s]||[s,'b-grey']; return `<span class="badge ${c}">${t}</span>`; }
function canRunOneToOne(o){
  if (o.employee_id===state.user.employee_id) return false;
  if (state.user.role==='hr_admin') return true;
  return state.user.role==='manager' && (o.with_id===state.user.employee_id || teamMemberIds().includes(o.employee_id));
}
function canSeeOneToOne(o){ return o.employee_id===state.user.employee_id || canRunOneToOne(o); }
// Who a request waits on: the named manager; HR picks up requests nobody else can action.
function isOneToOneApprover(o){
  if (!canRunOneToOne(o)) return false;
  if (state.user.role!=='hr_admin') return true;
  const mgrHasLogin = o.with_id && Object.values(state.usersById).some(u=>u.employee_id===o.with_id && u.role!=='employee');
  return !mgrHasLogin;
}
const ooWith = o => o.with_id ? esc(empName(o.with_id)) : 'HR';
function oneToOneTable(list, showEmp, empty){
  if (!list.length) return `<div class="empty small">${empty||'No one-to-ones.'}</div>`;
  return `<div class="table-wrap"><table><thead><tr>${showEmp?'<th>Employee</th>':''}<th>With</th><th>Type</th><th>Date</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody>${
    list.map(o=>`<tr>${showEmp?`<td>${esc(empName(o.employee_id))}</td>`:''}<td>${ooWith(o)}</td><td>${esc(o.type)}</td><td>${o.date?fmtDate(o.date):'—'}${o.time?` <span class="small muted">${esc(o.time)}</span>`:''}</td><td class="small">${esc(o.location)||'—'}</td><td>${ooStatusBadge(o.status)}${o.status==='scheduled'&&o.date&&o.date<today()?' <span class="badge b-red">Write up</span>':''}</td><td style="text-align:right;white-space:nowrap">${
      o.status==='requested' && canRunOneToOne(o) ? `<button class="btn btn-success btn-sm" onclick="oneToOneForm({id:'${o.id}'})">Review request</button>` : `<button class="btn btn-outline btn-sm" onclick="oneToOneForm({id:'${o.id}'})">${canRunOneToOne(o)?'Open':'View'}</button>`
    }</td></tr>`).join('')
  }</tbody></table></div>`;
}
const sortOO = (a,b) => (b.date||'').localeCompare(a.date||'') || (b.created_at||'').localeCompare(a.created_at||'');
async function oneToOneForm(opts={}){
  const o = opts.id ? await idbGet('one_to_ones', opts.id) : null;
  if (opts.id && !o) return;
  const mode = !o ? (opts.request ? 'request' : 'schedule') : canRunOneToOne(o) ? 'run' : o.employee_id===state.user.employee_id ? 'own' : null;
  if (!mode){ toast('Not permitted','error'); return; }
  const isHR = state.user.role==='hr_admin';
  const me = empById(state.user.employee_id);
  const r = o || { type: opts.request?'Informal':'Monthly', date:'', time:'', location: (empById(opts.empId)||me||{}).site||'', agenda:'' };
  // Meeting details are editable when scheduling, by the manager while open, or by the employee while it's still a request
  const lock = (mode==='own' && o.status!=='requested') || (o && ['completed','declined','cancelled'].includes(o.status) && mode!=='run') ? 'disabled' : '';
  const team = state.employees.filter(e=>e.status!=='leaver' && canManageEmp(e.id) && e.id!==state.user.employee_id).sort((a,b)=>(a.last_name||'').localeCompare(b.last_name||''));
  const active = state.employees.filter(e=>e.status!=='leaver').sort((a,b)=>(a.last_name||'').localeCompare(b.last_name||''));
  let who = '';
  if (mode==='schedule'){
    who = `<div class="form-row">
      <div class="form-group"><label class="req">Employee</label><select id="oo-emp" required ${isHR?'onchange="ooEmpChanged()"':''}><option value="">Select…</option>${team.map(e=>`<option value="${e.id}" ${opts.empId===e.id?'selected':''}>${esc(e.first_name+' '+e.last_name)}</option>`).join('')}</select></div>
      ${isHR?`<div class="form-group"><label>With</label><select id="oo-with"><option value="">HR</option>${active.map(e=>`<option value="${e.id}" ${empById(opts.empId)?.manager_id===e.id?'selected':''}>${esc(e.first_name+' '+e.last_name)}</option>`).join('')}</select></div>`:`<div class="form-group"><label>With</label><input value="${esc(me?me.first_name+' '+me.last_name:'')}" disabled></div>`}
    </div>`;
  } else if (mode==='request'){
    who = `<p class="small muted" style="margin-bottom:12px">This request goes to ${me?.manager_id?`your manager, <strong>${esc(empName(me.manager_id))}</strong>`:'<strong>HR</strong>'}. They'll confirm the date or suggest another.</p>`;
  } else {
    who = `<div class="form-row"><div class="form-group"><label>Employee</label><input value="${esc(empName(o.employee_id))}" disabled></div>${
      mode==='run' && isHR ? `<div class="form-group"><label>With</label><select id="oo-with"><option value="">HR</option>${active.map(e=>`<option value="${e.id}" ${o.with_id===e.id?'selected':''}>${esc(e.first_name+' '+e.last_name)}</option>`).join('')}</select></div>`
      : `<div class="form-group"><label>With</label><input value="${o.with_id?esc(empName(o.with_id)):'HR'}" disabled></div>`}</div>`;
  }
  const meeting = `
    <div class="form-row">
      <div class="form-group"><label>Type</label><select id="oo-type" ${lock}>${optionList(ONE_TO_ONE_TYPES, r.type)}</select></div>
      <div class="form-group"><label>Location</label><select id="oo-loc" ${lock}><option value="">—</option>${optionList(MEETING_LOCATIONS, r.location)}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="${mode==='request'?'':'req'}">${mode==='request'?'Preferred date':'Date'}</label><input id="oo-date" type="date" value="${esc(r.date||'')}" ${lock} ${mode==='request'?'':'required'}></div>
      <div class="form-group"><label>Time</label><input id="oo-time" type="time" value="${esc(r.time||'')}" ${lock}></div>
    </div>
    <div class="form-group"><label>${mode==='request'?'What would you like to discuss?':'Agenda'}</label><textarea id="oo-agenda" rows="2" ${lock}>${esc(r.agenda||'')}</textarea></div>`;
  // Notes appear once the meeting is agreed
  let notes = '';
  if (o && o.status!=='requested' && o.status!=='declined'){
    const runRo = mode==='run' ? '' : 'disabled';
    notes = `<fieldset><legend>Meeting notes</legend>
      ${mode==='run'?`<div class="form-group"><label>Status</label><select id="oo-status">${[['scheduled','Scheduled'],['completed','Completed'],['cancelled','Cancelled']].map(([v,t])=>`<option value="${v}" ${o.status===v?'selected':''}>${t}</option>`).join('')}</select></div>`:''}
      <div class="form-group"><label>Notes <span class="small muted">(shared with ${mode==='run'?'the employee':'you'})</span></label><textarea id="oo-notes" rows="3" ${runRo}>${esc(o.notes||'')}</textarea></div>
      <div class="form-group"><label>Actions agreed</label><textarea id="oo-actions" rows="2" ${runRo}>${esc(o.actions||'')}</textarea></div>
      <div class="form-group"><label>Employee comments</label><textarea id="oo-empnotes" rows="2" ${mode==='own'?'':'disabled'}>${esc(o.employee_notes||'')}</textarea></div>
      ${mode==='run'?`<div class="form-group" style="margin-bottom:0"><label>Private notes <span class="small muted">(manager and HR only)</span></label><textarea id="oo-private" rows="2">${esc(o.private_notes||'')}</textarea></div>`:''}
    </fieldset>`;
  }
  let buttons = `<button type="button" class="btn btn-outline" onclick="closeModal()">Close</button>`;
  if (mode==='request') buttons += `<button type="submit" class="btn btn-primary">Send request</button>`;
  else if (mode==='schedule') buttons += `<button type="submit" class="btn btn-primary">Schedule</button>`;
  else if (mode==='run' && o.status==='requested') buttons = `<button type="button" class="btn btn-danger" style="margin-right:auto" onclick="declineOneToOne('${o.id}')">Decline</button>` + buttons + `<button type="submit" class="btn btn-primary">Accept &amp; schedule</button>`;
  else if (mode==='run') buttons += `<button type="submit" class="btn btn-primary">Save</button>`;
  else if (mode==='own' && o.status==='requested') buttons = `<button type="button" class="btn btn-danger" style="margin-right:auto" onclick="withdrawOneToOne('${o.id}')">Withdraw request</button>` + buttons + `<button type="submit" class="btn btn-primary">Save changes</button>`;
  else if (mode==='own' && ['scheduled','completed'].includes(o.status)) buttons += `<button type="submit" class="btn btn-primary">Save my comments</button>`;
  const title = mode==='request' ? 'Request a one-to-one' : mode==='schedule' ? 'Schedule a one-to-one' : o.status==='requested' && mode==='run' ? 'One-to-one request' : 'One-to-one';
  openModal(`<h2>${title}</h2>${o?`<div class="modal-sub">${ooStatusBadge(o.status)}${o.status==='requested'&&mode==='run'?' Confirm a date to accept, or decline.':''}</div>`:'<div class="modal-sub"></div>'}
    <form onsubmit="saveOneToOne(event,'${o?o.id:''}','${mode}')">${who}${meeting}${notes}<div class="modal-actions">${buttons}</div></form>`, true);
}
// HR scheduling: default "With" to the chosen employee's line manager
function ooEmpChanged(){ const e = empById(val('oo-emp')); const w = document.getElementById('oo-with'); if (w) w.value = e?.manager_id || ''; }
async function saveOneToOne(ev, id, mode){
  ev.preventDefault();
  const existing = id ? await idbGet('one_to_ones', id) : null;
  const meeting = { type: val('oo-type'), date: val('oo-date'), time: val('oo-time'), location: val('oo-loc'), agenda: val('oo-agenda') };
  const blank = { notes:'', actions:'', private_notes:'', employee_notes:'' };
  let rec, msg = 'Saved';
  if (mode==='request'){
    const me = empById(state.user.employee_id); if (!me) return;
    rec = { id:uuid(), employee_id:me.id, with_id:me.manager_id||null, ...meeting, status:'requested', ...blank, requested_by:state.user.username, created_at:nowISO() };
    msg = 'Request sent';
  } else if (mode==='schedule'){
    const empId = val('oo-emp');
    if (!empId || !canManageEmp(empId)){ toast('Choose one of your team','error'); return; }
    rec = { id:uuid(), employee_id:empId, with_id: state.user.role==='hr_admin' ? (val('oo-with')||null) : state.user.employee_id, ...meeting, status:'scheduled', ...blank, requested_by:state.user.username, created_at:nowISO() };
    msg = 'One-to-one scheduled';
  } else if (mode==='run'){
    if (!existing || !canRunOneToOne(existing)){ toast('Not permitted','error'); return; }
    rec = { ...existing, ...meeting };
    if (state.user.role==='hr_admin' && document.getElementById('oo-with')) rec.with_id = val('oo-with') || null;
    if (existing.status==='requested'){
      if (!meeting.date){ toast('Choose a date to accept the request','error'); return; }
      Object.assign(rec, { status:'scheduled', decided_by:state.user.username, decided_at:nowISO() });
      msg = 'Request accepted — one-to-one scheduled';
    } else {
      Object.assign(rec, { status: val('oo-status')||existing.status, notes: val('oo-notes'), actions: val('oo-actions'), private_notes: val('oo-private') });
      if (rec.status==='completed' && !existing.completed_at) rec.completed_at = nowISO();
    }
  } else if (mode==='own'){
    if (!existing || existing.employee_id!==state.user.employee_id) return;
    rec = { ...existing };
    if (existing.status==='requested') Object.assign(rec, meeting);
    else rec.employee_notes = val('oo-empnotes');
  } else return;
  rec.updated_at = nowISO();
  await idbPut('one_to_ones', rec);
  await logAction('one_to_one_'+mode, { employee_id: rec.employee_id });
  closeModal(); toast(msg); refreshLeaveViews();
}
async function declineOneToOne(id){
  const o = await idbGet('one_to_ones', id);
  if (!o || o.status!=='requested' || !canRunOneToOne(o)) return;
  if (!confirm('Decline this one-to-one request?')) return;
  Object.assign(o, { status:'declined', decided_by:state.user.username, decided_at:nowISO(), updated_at:nowISO() });
  await idbPut('one_to_ones', o); await logAction('one_to_one_declined', { employee_id:o.employee_id });
  closeModal(); toast('Request declined'); refreshLeaveViews();
}
async function withdrawOneToOne(id){
  const o = await idbGet('one_to_ones', id);
  if (!o || o.status!=='requested' || o.employee_id!==state.user.employee_id) return;
  if (!confirm('Withdraw this one-to-one request?')) return;
  Object.assign(o, { status:'cancelled', updated_at:nowISO() });
  await idbPut('one_to_ones', o); await logAction('one_to_one_withdrawn', { employee_id:o.employee_id });
  closeModal(); toast('Request withdrawn'); refreshLeaveViews();
}
// Requests + upcoming one-to-ones for the people this user manages (Performance page, dashboard)
async function managedOneToOnes(){
  const all = (await idbGetAll('one_to_ones')).filter(canRunOneToOne);
  return {
    all,
    requests: all.filter(o=>o.status==='requested' && isOneToOneApprover(o)).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9')),
    upcoming: all.filter(o=>o.status==='scheduled').sort((a,b)=>(a.date||'').localeCompare(b.date||'')),
    done: all.filter(o=>o.status==='completed').sort(sortOO)
  };
}

// ═══════════════════════════════════════════════
// BANK HOLIDAYS & SHUTDOWN DAYS
// ═══════════════════════════════════════════════
// One company_days row per closed day. Bank holidays are given in addition
// to holiday allowance. Shutdown days either use holiday (deducts) or are free.
// Neither is ever charged to an individual booking (see workingDays).
const isWeekend = ds => { const wd = new Date(ds).getDay(); return wd===0 || wd===6; };

// Re-count bookings that overlap days whose closed status changed. Bookings whose
// day count was edited by hand (doesn't match the automatic count) are left alone.
async function recountLeaveForClosedDays(oldClosed){
  const newClosed = state.closedDays;
  const changed = [...oldClosed].filter(d=>!newClosed.has(d)).concat([...newClosed].filter(d=>!oldClosed.has(d)));
  if (!changed.length) return 0;
  const affected = (await idbGetAll('leave')).filter(l => l.type!=='adjustment' && !l.half_day && ['approved','pending'].includes(l.status) && changed.some(d => d>=l.start_date && d<=l.end_date));
  let n = 0;
  for (const l of affected){
    const before = workingDays(l.start_date, l.end_date, oldClosed);
    if (Number(l.days) !== before) continue;
    const after = workingDays(l.start_date, l.end_date, newClosed);
    if (after !== before){ l.days = after; await idbPut('leave', l); n++; }
  }
  if (n) await logAction('leave_recounted', { detail:`${n} booking(s) re-counted after closed days changed` });
  return n;
}
async function saveCompanyDays(rows, msg){
  const old = new Set(state.closedDays);
  for (const r of rows) await idbPut('company_days', { id:uuid(), created_at:nowISO(), ...r });
  await refreshCaches();
  const n = await recountLeaveForClosedDays(old);
  await logAction('company_days_add', { detail: rows.map(r=>`${r.date} ${r.name}`).join('; ') });
  closeModal(); toast(msg + (n?` · ${n} existing booking${n!==1?'s':''} re-counted`:''));
  if (rows[0]) window._cdYear = rows[0].date.slice(0,4);
  navigate('company-days');
}

// RETURN TO WORK & BRADFORD FACTOR
// ═══════════════════════════════════════════════
// A return-to-work (RTW) interview is recorded against each sickness record.
// Interviews are flagged as due for sickness that ended in the last 60 days.
// Bradford Factor = S² × D over the last 52 weeks (S = spells, D = days).
// No trigger/warning levels are applied — the score is for information only.
const RTW_DUE_WINDOW = 60;
const RTW_CERT = ['Self-certified','Fit note received','Fit note to follow','Not required'];
const RTW_FIT = ['Fit for full duties','Fit with adjustments','Phased return'];
function isRtwDue(l, done){ return l.type==='sickness' && l.status==='approved' && l.end_date < today() && l.end_date >= addDays(today(), -RTW_DUE_WINDOW) && !done.has(l.id); }
function bradford(empId, leave, asOf = today()){
  const from = addDays(asOf, -364);
  const spells = leave.filter(l => l.employee_id===empId && l.type==='sickness' && l.status==='approved' && l.start_date>=from && l.start_date<=asOf);
  const S = spells.length, D = spells.reduce((a,l)=>a+(Number(l.days)||0), 0);
  return { S, D, score: S*S*D };
}
function rtwCell(l, done){
  if (done.has(l.id)) return `<button class="btn btn-outline btn-sm" onclick="rtwForm('${l.id}')">View RTW</button>`;
  if (l.end_date >= today()) return '<span class="small muted">Still off</span>';
  if (!canManageEmp(l.employee_id)) return '<span class="small muted">—</span>';
  return `<button class="btn btn-accent btn-sm" onclick="rtwForm('${l.id}')">Return to work</button>${isRtwDue(l, done)?' <span class="badge b-amber">Due</span>':''}`;
}

// Next working day after a date (skips weekends and closed days)
function nextWorkingDay(ds){ let d = addDays(ds,1); while (isWeekend(d) || state.closedDays.has(d)) d = addDays(d,1); return d; }

    <form onsubmit="saveRtw(event,'${leaveId}')">
      ${canDo?`<div class="rtw-bf"><strong>Bradford Factor (last 52 weeks): ${bf.score}</strong> <span class="small muted">· ${bf.S} spell${bf.S!==1?'s':''} × ${bf.D} day${bf.D!==1?'s':''}${r?' · at the time of this interview':''}</span></div>`:''}

async function saveRtw(ev, leaveId){
  ev.preventDefault();
  const l = await idbGet('leave', leaveId); if (!l) return;
  const existing = await idbGet('rtw', leaveId);
  const canDo = canManageEmp(l.employee_id), own = l.employee_id===state.user.employee_id;
  let rec;
  if (canDo){
    rec = { ...(existing||{}), leave_id: leaveId, employee_id: l.employee_id,
      interview_date: val('rt-date'), returned_date: val('rt-back'), reason: val('rt-reason'), certification: val('rt-cert'), work_related: val('rt-work'),
      accident_book: val('rt-acc'), fitness: val('rt-fit'), oh_referral: val('rt-oh'), support: val('rt-support'), notes: val('rt-notes'),
      employee_comments: existing?.employee_comments || '',
      bradford: existing?.bradford || bradford(l.employee_id, await idbByIndex('leave','employee_id',l.employee_id)),
      conducted_by: existing?.conducted_by || state.user.full_name, created_at: existing?.created_at || nowISO() };
  } else if (own && existing){
    rec = { ...existing, employee_comments: val('rt-emp') };
  } else return;
  rec.updated_at = nowISO();
  await idbPut('rtw', rec);
  await logAction(existing?'rtw_update':'rtw_complete', { employee_id: l.employee_id, detail:`Sickness ${l.start_date} to ${l.end_date}` });
  closeModal(); toast(existing ? 'Return-to-work saved' : 'Return-to-work interview completed'); refreshLeaveViews();
}

// ANNOUNCEMENTS
// ═══════════════════════════════════════════════
// Posted by HR to everyone, one site or one department. "New" is anything
// published since the person last opened the Announcements page.
function annAudienceLabel(a){
  if (!a.audience || a.audience==='all') return 'Everyone';
  const [t, v] = a.audience.split(':');
  return `${t==='site'?'Site':'Department'}: ${v}`;
}
function annVisibleTo(a){
  if (state.user.role==='hr_admin') return true;
  if (a.expires && a.expires < today()) return false;
  if (!a.audience || a.audience==='all') return true;
  const e = empById(state.user.employee_id); if (!e) return false;
  const [t, v] = a.audience.split(':');
  return t==='site' ? e.site===v : e.department===v;
}
async function visibleAnnouncements(){
  return (await idbGetAll('announcements')).filter(annVisibleTo).sort((a,b)=>(!!b.pinned - !!a.pinned) || (b.created_at||'').localeCompare(a.created_at||''));
}
function isNewAnnouncement(a){ return state.user.role!=='hr_admin' && (!a.expires || a.expires>=today()) && (a.created_at||'') > (state.user.ann_seen_at||''); }
function annCardHtml(a, canEdit, isNew){
  const expired = a.expires && a.expires < today();
  return `<div class="card ann-card${a.pinned?' pinned':''}${expired?' expired':''}">
    <div class="card-head" style="margin-bottom:6px"><h3>${a.pinned?'📌 ':''}${esc(a.title)} ${isNew?'<span class="badge b-yellow">New</span>':''}${expired?' <span class="badge b-grey">Expired</span>':''}</h3>
      ${canEdit?`<div class="doc-btns"><button class="btn btn-outline btn-sm" onclick="annForm('${a.id}')">Edit</button> <button class="btn btn-danger btn-sm" onclick="deleteAnn('${a.id}')">×</button></div>`:''}</div>
    <div class="small muted" style="margin-bottom:10px">${fmtDate(a.created_at)} · ${esc(annAudienceLabel(a))}${a.expires?` · until ${fmtDate(a.expires)}`:''}</div>
    <div class="ann-body">${esc(a.body)}</div>
  </div>`;
}
async function renderAnnouncements(c){
  const isHR = state.user.role==='hr_admin';

  if (isHR) setTopbar(`<button class="btn btn-accent" onclick="annForm()">+ New announcement</button>`);

  job_history_save:'Saved job history', job_history_change:'Recorded role change', job_history_delete:'Deleted job history',

  task_create:'Created task', task_update:'Updated task', task_complete:'Completed task', task_reopen:'Reopened task', task_delete:'Deleted task',
  settings_update:'Changed settings', seed:'System set up'
};
const auditLabel = a => AUDIT_LABELS[a] || String(a||'').replace(/_/g,' ').replace(/^./, ch=>ch.toUpperCase());
function auditDetail(r){
  const parts = [];
  if (r.changes) parts.push('Changed: '+r.changes);
  if (r.detail) parts.push(r.detail);
  if (r.username && r.action!=='login') parts.push('User: '+r.username);
  if (r.count) parts.push(r.count+' item(s)');
  if (r.period) parts.push(r.period);
  return parts.join(' · ');
}
async function renderAudit(c){
  const all = (await idbGetAll('audit_log')).sort((a,b)=>(b.timestamp||'').localeCompare(a.timestamp||''));
  window._auditAll = all; window._auditShow = 300;
  const users = [...new Set(all.map(r=>r.user).filter(Boolean))].sort();
  const actions = [...new Set(all.map(r=>r.action).filter(Boolean))].sort((a,b)=>auditLabel(a).localeCompare(auditLabel(b)));
  setTopbar(`<button class="btn btn-outline" onclick="exportAudit()">Export CSV</button>`);
  c.innerHTML = `
    <div class="toolbar">
      <input class="grow" id="au-q" placeholder="Search employee, detail…" oninput="filterAudit()">
      <select id="au-user" onchange="filterAudit()"><option value="">All users</option>${users.map(u=>`<option>${esc(u)}</option>`).join('')}</select>
      <select id="au-action" onchange="filterAudit()"><option value="">All actions</option>${actions.map(a=>`<option value="${esc(a)}">${esc(auditLabel(a))}</option>`).join('')}</select>
      <input type="date" id="au-from" onchange="filterAudit()" title="From">
      <input type="date" id="au-to" onchange="filterAudit()" title="To">
    </div>
    <div class="card"><div id="au-count" class="small muted" style="margin-bottom:10px"></div><div id="au-body"></div></div>
    <p class="small muted">Every sign-in and change made in the system is recorded here. Records can't be edited from this screen.</p>`;
  filterAudit();
}
function auditFiltered(){
  const q = val('au-q').toLowerCase(), u = val('au-user'), a = val('au-action'), from = val('au-from'), to = val('au-to');
  return (window._auditAll||[]).filter(r => {
    if (u && r.user!==u) return false;
    if (a && r.action!==a) return false;
    const day = (r.timestamp||'').slice(0,10);
    if (from && day < from) return false;
    if (to && day > to) return false;
    if (q){ const hay = `${r.employee_id?empName(r.employee_id):''} ${auditLabel(r.action)} ${auditDetail(r)} ${r.user||''}`.toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
}
function filterAudit(more){
  if (more) window._auditShow += 300; else window._auditShow = 300;
  const rows = auditFiltered(), shown = rows.slice(0, window._auditShow);
  document.getElementById('au-count').textContent = `${rows.length} entr${rows.length!==1?'ies':'y'}${rows.length>shown.length?` · showing the latest ${shown.length}`:''}`;
  const when = ts => { const d = new Date(ts); return isNaN(d) ? '—' : d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
  document.getElementById('au-body').innerHTML = shown.length ? `<div class="table-wrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Employee</th><th>Details</th></tr></thead><tbody>${
    shown.map(r=>`<tr><td class="small" style="white-space:nowrap">${when(r.timestamp)}</td><td>${esc(r.user)||'—'}</td><td>${esc(auditLabel(r.action))}</td><td>${r.employee_id?esc(empName(r.employee_id)):'—'}</td><td class="small">${esc(auditDetail(r))||'—'}</td></tr>`).join('')
  }</tbody></table></div>${rows.length>shown.length?`<div style="text-align:center;margin-top:12px"><button class="btn btn-outline btn-sm" onclick="filterAudit(true)">Show more</button></div>`:''}` : '<div class="empty small">No entries match.</div>';
}
function exportAudit(){
  const rows = [['Date/time','User','Action','Employee','Details']];
  auditFiltered().forEach(r => rows.push([r.timestamp, r.user||'', auditLabel(r.action), r.employee_id?empName(r.employee_id):'', auditDetail(r)]));
  downloadCSV('komfort-audit-trail.csv', rows);
}

async function renderReports(c){
  const emps = state.employees;
  const active = emps.filter(e=>e.status==='active');
  const leave = await idbGetAll('leave');
  const bounds = await holidayYearBounds();

  // Headcount by site / dept
  const bySite = {}; const byDept = {};
  active.forEach(e=>{ bySite[e.site]=(bySite[e.site]||0)+1; byDept[e.department]=(byDept[e.department]||0)+1; });

  // Absence: sickness in current holiday year
  const sick = leave.filter(l=>l.type==='sickness' && l.status==='approved' && l.start_date>=bounds.start && l.start_date<=bounds.end);
  const sickDays = sick.reduce((a,l)=>a+l.days,0);
  const sickInstances = sick.length;
  // approx working days available = active * ~260
  const workDaysAvail = active.length * 260;
  const absenceRate = workDaysAvail ? (sickDays/workDaysAvail*100) : 0;

  // Retention: starters & leavers in current calendar year
  const yr = thisYear();
  const starters = emps.filter(e=>e.start_date && e.start_date.slice(0,4)===yr).length;
  const leavers = emps.filter(e=>e.end_date && e.end_date.slice(0,4)===yr).length;
  const turnover = active.length ? (leavers/((active.length+leavers))*100) : 0;

  c.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num">${active.length}</div><div class="lbl">Current employees</div></div>
      <div class="stat ${absenceRate>3?'warn':'ok'}"><div class="num">${absenceRate.toFixed(1)}%</div><div class="lbl">Absence rate (${bounds.label})</div></div>
      <div class="stat info"><div class="num">${starters}</div><div class="lbl">Starters ${yr}</div></div>
      <div class="stat ${leavers?'warn':'ok'}"><div class="num">${leavers}</div><div class="lbl">Leavers ${yr}</div></div>

    </div>

    <div class="form-row">
      <div class="card"><div class="card-head"><h3>Headcount by site</h3></div>
        <table><tbody>${SITES.map(s=>`<tr><td>${s}</td><td style="text-align:right"><strong>${bySite[s]||0}</strong></td></tr>`).join('')}</tbody></table>
      </div>
      <div class="card"><div class="card-head"><h3>Headcount by department</h3></div>
        <table><tbody>${Object.keys(byDept).sort().map(d=>`<tr><td>${esc(d)}</td><td style="text-align:right"><strong>${byDept[d]}</strong></td></tr>`).join('')||'<tr><td class="muted">—</td></tr>'}</tbody></table>
      </div>
    </div>

    <div class="card"><div class="card-head"><h3>Absence summary (${bounds.label})</h3><button class="btn btn-outline btn-sm" onclick="exportAbsence()">Export CSV</button></div>
      <div class="stat-grid">
        <div class="stat warn"><div class="num">${sickDays}</div><div class="lbl">Total sick days</div></div>
        <div class="stat"><div class="num">${sickInstances}</div><div class="lbl">Absence instances</div></div>
        <div class="stat"><div class="num">${active.length?(sickDays/active.length).toFixed(1):0}</div><div class="lbl">Avg days / employee</div></div>
      </div>
    </div>

    <div class="card"><div class="card-head"><h3>Annual leave balances</h3><button class="btn btn-outline btn-sm" onclick="exportLeaveBalances()">Export CSV</button></div>
      <div class="table-wrap"><table id="rep-leave"><thead><tr><th>Employee</th><th>Site</th><th>Allowance</th><th>Adj</th><th>Entitlement</th><th>Booked</th><th>Pending</th><th>Remaining</th></tr></thead><tbody><tr><td colspan="8" class="muted">Loading…</td></tr></tbody></table></div>
    </div>

    <div class="card"><div class="card-head"><h3>Current employees</h3><button class="btn btn-outline btn-sm" onclick="exportHeadcount()">Export CSV</button></div>
      <div class="table-wrap"><table><thead><tr><th>No.</th><th>Name</th><th>Job title</th><th>Dept</th><th>Site</th><th>Start date</th><th>Service</th></tr></thead><tbody>${
        active.sort((a,b)=>a.last_name.localeCompare(b.last_name)).map(e=>`<tr><td>${esc(e.employee_number)}</td><td>${esc(e.first_name+' '+e.last_name)}</td><td>${esc(e.job_title)}</td><td>${esc(e.department)}</td><td>${esc(e.site)}</td><td>${fmtDate(e.start_date)}</td><td>${serviceYears(e.start_date)}</td></tr>`).join('')
      }</tbody></table></div>
    </div>`;

  // fill leave balances async
  const tb = document.querySelector('#rep-leave tbody');

  for (const e of active.sort((a,b)=>a.last_name.localeCompare(b.last_name))){
    const b = await leaveBalance(e.id);
    rows.push(`<tr><td>${esc(e.first_name+' '+e.last_name)}</td><td>${esc(e.site)}</td><td>${b.allowance}</td><td>${b.adjustments?(b.adjustments>0?'+':'')+b.adjustments:'—'}</td><td>${b.entitlement}</td><td>${b.booked}</td><td>${b.pending}</td><td><strong>${b.remaining}</strong></td></tr>`);
  }
  tb.innerHTML = rows.join('') || '<tr><td colspan="8" class="muted">—</td></tr>';

async function saveUser(ev, id){
  ev.preventDefault();
  const all = await idbGetAll('users');
  const existing = id ? all.find(x=>x.id===id) : null;
  const username = val('us-username').toLowerCase();
  if (!existing && all.some(x=>x.username.toLowerCase()===username)){ toast('Username already exists','error'); return; }
  let password_hash = existing?.password_hash;
  if (!id) password_hash = await sha256(val('us-pwd'));
  await idbPut('users', { id:id||uuid(), username, password_hash, role:val('us-role'), employee_id:val('us-emp')||null, full_name:val('us-name'), must_change_password: !id, created_at:existing?.created_at||nowISO() });
  await logAction(id?'user_update':'user_create', { username });
  await refreshCaches();
  closeModal(); toast('Account saved'); navigate('users');
}
async function resetPwd(id){
  const np = prompt('Enter a new temporary password:', 'Welcome123');
  if (!np) return;
  const u = (await idbGetAll('users')).find(x=>x.id===id);
  u.password_hash = await sha256(np); u.must_change_password = true;
  await idbPut('users', u);
  await logAction('password_reset', { username:u.username });
  toast('Password reset');
}
async function deleteUser(id){ const u=(await idbGetAll('users')).find(x=>x.id===id); if(u.username==='admin'){toast('Cannot delete admin','error');return;} if(!confirm('Delete this account?'))return; await idbDelete('users',id); await logAction('user_delete', { username:u.username }); await refreshCaches(); toast('Account deleted'); navigate('users'); }

async function saveSettings(){ await setSetting('company_name', val('set-cn')); await setSetting('holiday_year_start', val('set-hys')||'01-01'); await logAction('settings_update', { detail:`Holiday year starts ${val('set-hys')||'01-01'}` }); toast('Settings saved'); }
async function exportAllData(){
  const dump = {};
  for (const s of STORES) dump[s] = await idbGetAll(s);
  const blob = new Blob([JSON.stringify(dump,null,2)], {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='komfort-hr-backup-'+today()+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
async function resetAllData(){
  if (!confirm('This deletes ALL HR data in this browser and reloads demo data. Continue?')) return;
  for (const s of STORES){ const all = await idbGetAll(s); for (const r of all){ await idbDelete(s, r[(s==='settings')?'key':'id']); } }
  await seedDefaults(); toast('Data reset'); logout();
}

  const sickness = (await idbByIndex('leave','employee_id',id)).filter(l=>l.type==='sickness').sort((a,b)=>b.start_date.localeCompare(a.start_date));
  const thisYr = sickness.filter(l=>l.start_date>=bounds.start && l.start_date<=bounds.end);

  const done = await rtwDoneSet();
  c.innerHTML = `
    <div class="stat-grid">
      <div class="stat ${totalDays>0?'warn':'ok'}"><div class="num">${totalDays}</div><div class="lbl">Sick days (${bounds.label})</div></div>

async function saveMyPassword(ev){
  ev.preventDefault();
  const cur = await sha256(val('pw-cur'));
  if (cur !== state.user.password_hash){ toast('Current password incorrect','error'); return; }
  if (val('pw-new') !== val('pw-conf')){ toast('New passwords do not match','error'); return; }
  state.user.password_hash = await sha256(val('pw-new')); state.user.must_change_password=false;
  await idbPut('users', state.user);
  await logAction('password_change');
  closeModal(); toast('Password changed');
}
