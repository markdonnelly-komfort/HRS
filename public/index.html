<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#565A5C">
  <title>Komfort - HR System</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #404042;        /* Komfort dark charcoal */
      --primary-light: #565A5C;  /* Komfort charcoal */
      --accent: #FDC82F;         /* Komfort yellow */
      --success: #2e7d32;
      --warning: #ef6c00;
      --danger: #c62828;
      --info: #1565c0;
      --bg: #F4F6F7;
      --card: #ffffff;
      --text: #404042;
      --text-light: #757677;
      --border: #dfe2e4;
      --shadow: 0 2px 8px rgba(64,64,66,0.12);
      --sidebar-w: 240px;
    }
    body { font-family: Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    h1,h2,h3,h4,h5,h6 { color: var(--primary); font-weight: 700; }
    a { color: var(--info); }

    .hidden { display: none !important; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 18px; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all .2s; text-decoration: none; gap: 8px; }
    .btn-primary { background: var(--primary-light); color: var(--accent); }
    .btn-primary:hover { background: var(--primary); }
    .btn-accent { background: var(--accent); color: var(--primary); }
    .btn-accent:hover { filter: brightness(.95); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
    .btn-outline:hover { background: var(--primary); color: var(--accent); }
    .btn-sm { padding: 6px 12px; font-size: 0.825rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Forms ── */
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--text); font-size: 0.875rem; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: #fff; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .req::after { content: " *"; color: var(--danger); }
    fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    legend { padding: 0 8px; font-weight: 700; color: var(--primary); font-size: 0.95rem; }

    /* ── Cards / layout ── */
    .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .muted { color: var(--text-light); }
    .small { font-size: 0.85rem; }

    /* ── Stat tiles ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap: 16px; margin-bottom: 16px; }
    .stat { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; border-left: 5px solid var(--accent); position: relative; }
    .stat .num { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat.clickable { cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .stat.clickable:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(64,64,66,0.18); }
    .stat.clickable::after { content: "›"; position: absolute; top: 12px; right: 14px; color: var(--text-light); font-size: 1.2rem; opacity: .5; }
    .stat .lbl { color: var(--text-light); font-size: 0.85rem; margin-top: 2px; }
    .stat.warn { border-left-color: var(--warning); }
    .stat.ok { border-left-color: var(--success); }
    .stat.info { border-left-color: var(--info); }

    /* ── Tables ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
    th { background: var(--bg); font-weight: 700; color: var(--primary); white-space: nowrap; }
    tbody tr:hover { background: #fafbfc; }
    .clickable { cursor: pointer; }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; }
    .b-green { background: #e3f3e4; color: var(--success); }
    .b-red { background: #fde8e8; color: var(--danger); }
    .b-amber { background: #fff3e0; color: var(--warning); }
    .b-grey { background: #e9ecef; color: var(--text-light); }
    .b-blue { background: #e3f0fb; color: var(--info); }
    .b-yellow { background: var(--accent); color: var(--primary); }

    /* ── Avatar ── */
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; overflow: hidden; font-size: 0.9rem; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-lg { width: 96px; height: 96px; font-size: 2rem; }

    /* ── Login ── */
    #login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#404042,#565A5C); padding: 20px; }
    .login-card { background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.3); padding: 36px; width: 100%; max-width: 400px; border-top: 6px solid var(--accent); }
    .login-logo { text-align: center; margin-bottom: 8px; font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; color: var(--primary); }
    .login-sub { text-align: center; color: var(--text-light); margin-bottom: 24px; }
    .login-hint { margin-top: 18px; font-size: 0.78rem; color: var(--text-light); background: var(--bg); border-radius: 8px; padding: 10px 12px; }

    /* ── App shell ── */
    #app { display: none; min-height: 100vh; }
    #app.active { display: flex; }
    .sidebar { width: var(--sidebar-w); background: var(--primary); color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; z-index: 50; transition: transform .25s; }
    .sidebar .brand { padding: 20px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .sidebar .brand .logo { font-size: 1.3rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
    .sidebar .brand .sub { font-size: 0.75rem; color: rgba(255,255,255,.6); }
    .nav { flex: 1; overflow-y: auto; padding: 10px 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: rgba(255,255,255,.82); cursor: pointer; font-size: 0.92rem; border-left: 4px solid transparent; }
    .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-item.active { background: rgba(253,200,47,.14); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
    .nav-item .ic { width: 20px; text-align: center; }
    .nav-badge { margin-left: auto; background: var(--accent); color: var(--primary); border-radius: 10px; padding: 1px 8px; font-size: 0.72rem; font-weight: 700; }
    .sidebar .who { padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.1); font-size: 0.82rem; }
    .sidebar .who .name { color: #fff; font-weight: 600; }
    .sidebar .who .role { color: rgba(255,255,255,.55); text-transform: capitalize; }

    .main { flex: 1; min-width: 0; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--primary-light); color: var(--accent); padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 40; border-bottom: 4px solid var(--accent); }
    .topbar h1 { color: var(--accent); font-size: 1.2rem; }
    .topbar .ta { display: flex; gap: 8px; align-items: center; }
    .hamburger { display: none; background: none; border: none; color: var(--accent); font-size: 1.5rem; cursor: pointer; }
    .content { padding: 22px; flex: 1; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
    .tab { padding: 10px 16px; cursor: pointer; font-weight: 600; color: var(--text-light); border-bottom: 3px solid transparent; margin-bottom: -2px; font-size: 0.9rem; }
    .tab.active { color: var(--primary); border-bottom-color: var(--accent); }

    /* ── Toolbar ── */
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar input, .toolbar select { padding: 9px 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.9rem; background: #fff; }
    .toolbar .grow { flex: 1; min-width: 180px; }

    /* ── Modal ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; }
    .modal-overlay.active { display: flex; }
    .modal { background: #fff; border-radius: 14px; padding: 24px; max-width: 640px; width: 100%; margin: auto; }
    .modal.wide { max-width: 860px; }
    .modal h2 { margin-bottom: 4px; }
    .modal .modal-sub { color: var(--text-light); margin-bottom: 16px; font-size: 0.9rem; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

    /* ── Toast ── */
    .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
    .toast { padding: 12px 18px; border-radius: 8px; color: #fff; margin-top: 8px; font-weight: 500; box-shadow: var(--shadow); animation: slideIn .3s; }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-info { background: var(--info); }
    @keyframes slideIn { from { transform: translateX(110%);} to { transform: translateX(0);} }

    /* ── Detail layout ── */
    .detail-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
    .detail-head .who h2 { margin: 0; }
    .kv { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; }
    .kv dt { font-weight: 600; color: var(--text-light); font-size: 0.85rem; }
    .kv dd { font-size: 0.95rem; }
    @media (max-width: 600px){ .kv { grid-template-columns: 1fr; gap: 2px 0; } .kv dd { margin-bottom: 8px; } }

    .progress { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; min-width: 80px; }
    .progress > div { height: 100%; background: var(--success); border-radius: 4px; }

    .empty { text-align: center; color: var(--text-light); padding: 40px 20px; }
    .empty .ic { font-size: 2.5rem; display: block; margin-bottom: 8px; opacity: .5; }

    .pill-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .pill { padding: 6px 14px; border-radius: 20px; border: 2px solid var(--border); background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--text-light); }
    .pill.active { background: var(--primary); color: var(--accent); border-color: var(--primary); }

    .doc-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
    .doc-row .dic { font-size: 1.6rem; }
    .doc-row .di { flex: 1; min-width: 0; }
    .doc-row .di .t { font-weight: 600; }
    .doc-row .di .small { overflow-wrap: anywhere; }
    .doc-row { flex-wrap: wrap; }
    .doc-row .doc-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .ack-banner { border-left: 5px solid var(--accent); background: #fffbea; }
    .reveal .reveal-val { display: none; cursor: pointer; }
    .reveal.shown .reveal-val { display: inline; }
    .reveal.shown .btn { display: none; }
    .rtw-bf { background: var(--bg); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; }
    .ann-card.pinned { border-left: 5px solid var(--accent); }
    .ann-card.expired { opacity: .6; }
    .ann-body { white-space: pre-wrap; line-height: 1.5; overflow-wrap: anywhere; }
    .ann-mini { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .ann-mini:last-child { border-bottom: 0; }
    .ann-snip { margin-top: 4px; white-space: pre-wrap; color: var(--text); }
    .ack-banner .doc-row { background: #fff; }

    /* ── Team calendar (people × days) ── */
    .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 12px; font-size: 0.85rem; }
    .cal-legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .cal-wrap { overflow-x: auto; }
    .cal-grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
    .cal-grid th, .cal-grid td { padding: 4px 2px; text-align: center; border-bottom: 1px solid var(--border); font-size: 0.72rem; }
    .cal-grid th.cal-day { min-width: 28px; line-height: 1.25; font-weight: 600; }
    .cal-grid .cal-name { position: sticky; left: 0; z-index: 1; background: var(--card); text-align: left; padding: 6px 10px; min-width: 160px; max-width: 200px; border-right: 1px solid var(--border); font-size: 0.85rem; }
    .cal-grid th.cal-name { background: var(--bg); }
    .cal-grid .cal-name a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .cal-grid .we { background: #eef0f2; }
    .cal-grid th.today { background: var(--accent); color: var(--primary); }
    .cal-grid td.today { background: #fffbea; }
    .cal-grid tbody tr:hover td { background: #fafbfc; }
    .cal-grid tbody tr:hover td.we { background: #e6e9ec; }
    .cal-chip { display: inline-block; min-width: 20px; padding: 2px 3px; margin: 1px 0; border-radius: 5px; font-size: 0.68rem; font-weight: 700; line-height: 1.3; text-align: center; }
    .cal-hol { background: var(--info); color: #fff; }
    .cal-sick { background: var(--danger); color: #fff; }
    .cal-oth { background: var(--warning); color: #fff; }
    .cal-away { background: #9aa0a6; color: #fff; }
    .cal-oo { background: var(--primary-light); color: var(--accent); }
    .cal-chip.pending { background: #fff; color: var(--info); box-shadow: inset 0 0 0 2px var(--info); }
    .cal-grid .closed { background: repeating-linear-gradient(135deg, #e7eaee, #e7eaee 4px, #f4f6f7 4px, #f4f6f7 8px); }
    .cal-grid th.closed.today { background: var(--accent); }
    .cal-cd { font-size: 0.6rem; font-weight: 700; color: var(--primary-light); }
    .cal-closed { background: #cfd4d9; color: var(--primary); }
    @media (max-width: 600px){ .cal-grid .cal-name { min-width: 110px; max-width: 130px; padding: 6px; font-size: 0.8rem; } }

    /* ── Organisation chart (top-down tree with connector lines) ── */
    .org-wrap { overflow-x: auto; padding: 4px 0 12px; }
    .org-tree { display: flex; justify-content: center; min-width: max-content; }
    .org-tree ul { position: relative; display: flex; justify-content: center; margin: 0; padding: 20px 0 0; }
    .org-tree > ul { padding-top: 0; }
    .org-tree li { list-style: none; position: relative; text-align: center; padding: 20px 6px 0; }
    .org-tree li::before, .org-tree li::after { content: ''; position: absolute; top: 0; right: 50%; width: 50%; height: 20px; border-top: 2px solid #c8ccd0; }
    .org-tree li::after { right: auto; left: 50%; border-left: 2px solid #c8ccd0; }
    .org-tree li:only-child::before, .org-tree li:only-child::after { display: none; }
    .org-tree li:only-child { padding-top: 0; }
    .org-tree li:first-child::before, .org-tree li:last-child::after { border: 0 none; }
    .org-tree li:last-child::before { border-right: 2px solid #c8ccd0; border-radius: 0 6px 0 0; }
    .org-tree li:first-child::after { border-radius: 6px 0 0 0; }
    .org-tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; height: 20px; border-left: 2px solid #c8ccd0; }
    .org-tree > ul > li { padding-top: 0; }
    .org-tree > ul > li::before, .org-tree > ul > li::after { display: none; }
    .org-node { display: inline-block; width: 168px; background: var(--card); border: 1px solid var(--border); border-top: 4px solid var(--accent); border-radius: 10px; padding: 10px 8px; box-shadow: var(--shadow); cursor: pointer; transition: opacity .15s, box-shadow .15s, transform .15s; }
    .org-node:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(64,64,66,0.18); }
    .org-node .avatar { margin-bottom: 6px; }
    .org-node .org-name { font-weight: 700; color: var(--primary); font-size: 0.9rem; }
    .org-node .org-title { font-size: 0.8rem; color: var(--text); margin-top: 2px; }
    .org-node .org-meta { font-size: 0.72rem; color: var(--text-light); margin-top: 2px; }
    .org-node.me { border-top-color: var(--primary-light); background: #fffbea; }
    .org-node.dim { opacity: .3; }
    .org-node.hit { outline: 3px solid var(--accent); outline-offset: 2px; }

    @media (max-width: 860px){
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .hamburger { display: block; }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
    }
    @media print {
      .sidebar, .topbar, .toolbar, .btn, .tabs, .pill-tabs { display: none !important; }
      .main { margin-left: 0; }
      .content { padding: 0; }
      #app.active { display: block; }
    }
  </style>
</head>
<body>

<!-- ═══════════════ LOGIN ═══════════════ -->
<div id="login-view">
  <div class="login-card">
    <div style="text-align:center"><img src="/logo.svg" alt="Komfort" style="height:64px;margin-bottom:8px;"></div>
    <div class="login-sub">HR System</div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input id="login-username" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
    </form>
    <div class="login-hint">
      <strong>Demo accounts</strong><br>
      HR Admin — <code>admin</code> / <code>admin123</code><br>
      Manager — <code>manager</code> / <code>manager123</code><br>
      Employee — <code>employee</code> / <code>employee123</code>
    </div>
  </div>
</div>

<!-- ═══════════════ APP SHELL ═══════════════ -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/logo-light.svg" alt="Komfort" style="height:34px;display:block;margin-bottom:4px;">
      <div class="sub">HR System</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="who">
      <div class="name" id="who-name"></div>
      <div class="role" id="who-role"></div>
      <button class="btn btn-outline btn-sm" style="margin-top:10px;width:100%;border-color:rgba(255,255,255,.4);color:#fff" onclick="logout()">Sign out</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="hamburger" onclick="toggleSidebar()">&#9776;</button>
        <h1 id="page-title">Dashboard</h1>
      </div>
      <div class="ta" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal"></div></div>
<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATABASE LAYER — IndexedDB (offline/local persistence)
// Mirrors the schema in database.js so it can move to the Node
// backend later without changing the data shape.
// ═══════════════════════════════════════════════════════════════
const DB_NAME = 'KomfortHR';
// v4: payroll feature removed. Version is kept above the old payroll schema (v3)
// so browsers that ran the payroll build upgrade cleanly (and have the payroll
// object stores dropped) rather than hitting an IndexedDB version-downgrade error.
// v5: training records + uploaded pay documents (payslips / P60 / P11D).
// v6: job history, one-to-ones, policy read-and-understood confirmations.
// v7: bank holidays / shutdown days, return-to-work interviews, announcements.
const DB_VERSION = 7;
const STORES = ['users','employees','contacts','documents','leave','reviews','objectives','tasks','audit_log','settings','training','pay_documents','jobs','one_to_ones','doc_acks','company_days','rtw','announcements'];
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('users')) {
        const s = d.createObjectStore('users', { keyPath: 'id' });
        s.createIndex('username', 'username', { unique: true });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('employees')) {
        const s = d.createObjectStore('employees', { keyPath: 'id' });
        s.createIndex('manager_id', 'manager_id');
        s.createIndex('status', 'status');
      }
      if (!d.objectStoreNames.contains('contacts')) {
        const s = d.createObjectStore('contacts', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('documents')) {
        const s = d.createObjectStore('documents', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
        s.createIndex('category', 'category');
      }
      // Sparse index: only documents with ack=1 (need read & understood confirmation)
      // are in it, so badges can find them without loading every stored file.
      const docStore = e.target.transaction.objectStore('documents');
      if (!docStore.indexNames.contains('ack')) docStore.createIndex('ack', 'ack');
      if (!d.objectStoreNames.contains('leave')) {
        const s = d.createObjectStore('leave', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
        s.createIndex('status', 'status');
      }
      if (!d.objectStoreNames.contains('reviews')) {
        const s = d.createObjectStore('reviews', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('objectives')) {
        const s = d.createObjectStore('objectives', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('tasks')) {
        const s = d.createObjectStore('tasks', { keyPath: 'id' });
        s.createIndex('assigned_to', 'assigned_to');
        s.createIndex('status', 'status');
      }
      if (!d.objectStoreNames.contains('audit_log')) {
        const s = d.createObjectStore('audit_log', { keyPath: 'id', autoIncrement: true });
        s.createIndex('timestamp', 'timestamp');
      }
      if (!d.objectStoreNames.contains('settings')) {
        d.createObjectStore('settings', { keyPath: 'key' });
      }
      if (!d.objectStoreNames.contains('training')) {
        const s = d.createObjectStore('training', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('pay_documents')) {
        const s = d.createObjectStore('pay_documents', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('jobs')) {
        const s = d.createObjectStore('jobs', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('one_to_ones')) {
        const s = d.createObjectStore('one_to_ones', { keyPath: 'id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('doc_acks')) {
        // id = `${document_id}:${employee_id}` so a person can only confirm a document once
        const s = d.createObjectStore('doc_acks', { keyPath: 'id' });
        s.createIndex('document_id', 'document_id');
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('company_days')) {
        // One row per closed day (bank holiday or shutdown day)
        const s = d.createObjectStore('company_days', { keyPath: 'id' });
        s.createIndex('date', 'date');
      }
      if (!d.objectStoreNames.contains('rtw')) {
        // Return-to-work interview, one per sickness record (keyed by its leave id)
        const s = d.createObjectStore('rtw', { keyPath: 'leave_id' });
        s.createIndex('employee_id', 'employee_id');
      }
      if (!d.objectStoreNames.contains('announcements')) {
        d.createObjectStore('announcements', { keyPath: 'id' });
      }
      // Drop payroll stores from any browser that ran the removed payroll build.
      ['pay_components','pay_runs','payslips','recurring_deductions'].forEach(s => {
        if (d.objectStoreNames.contains(s)) d.deleteObjectStore(s);
      });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}
const tx = (store, mode='readonly') => db.transaction(store, mode).objectStore(store);
function idbGetAll(s){ return new Promise((res,rej)=>{ const r=tx(s).getAll(); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e.target.error); }); }
function idbGet(s,k){ return new Promise((res,rej)=>{ const r=tx(s).get(k); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e.target.error); }); }
function idbPut(s,v){ return new Promise((res,rej)=>{ const r=tx(s,'readwrite').put(v); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e.target.error); }); }
function idbAdd(s,v){ return new Promise((res,rej)=>{ const r=tx(s,'readwrite').add(v); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e.target.error); }); }
function idbDelete(s,k){ return new Promise((res,rej)=>{ const r=tx(s,'readwrite').delete(k); r.onsuccess=()=>res(); r.onerror=e=>rej(e.target.error); }); }
function idbByIndex(s,idx,val){ return new Promise((res,rej)=>{ const r=tx(s).index(idx).getAll(val); r.onsuccess=()=>res(r.result); r.onerror=e=>rej(e.target.error); }); }

function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx'.replace(/x/g,()=>Math.floor(Math.random()*16).toString(16)); }
function nowISO(){ return new Date().toISOString(); }
function today(){ return new Date().toISOString().slice(0,10); }

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function logAction(action, details={}){ try{ await idbAdd('audit_log', { timestamp: nowISO(), user: state.user?.username||'system', action, ...details }); }catch(e){} }

const state = { user: null, page: null, employees: [], usersById: {}, companyDays: [], closedDays: new Set() };

async function handleLogin(e){
  e.preventDefault();
  const u = document.getElementById('login-username').value.trim().toLowerCase();
  const p = document.getElementById('login-password').value;
  const all = await idbGetAll('users');
  const user = all.find(x => x.username.toLowerCase() === u);
  if (!user){ await logAction('login_failed', { username:u }); toast('Invalid username or password','error'); return; }
  const hash = await sha256(p);
  if (hash !== user.password_hash){ await logAction('login_failed', { username:u }); toast('Invalid username or password','error'); return; }
  state.user = user;
  sessionStorage.setItem('hr_session', user.id);
  await logAction('login');
  await enterApp();
}

async function enterApp(){
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app').classList.add('active');
  await refreshCaches();
  document.getElementById('who-name').textContent = state.user.full_name;
  document.getElementById('who-role').textContent = roleLabel(state.user.role);
  buildNav();
  const start = state.user.role === 'employee' ? 'my-profile' : 'dashboard';
  navigate(start);
}

function roleLabel(r){ return ({hr_admin:'HR Admin', manager:'Manager', employee:'Employee'})[r] || r; }

function logout(){
  if (state.user) logAction('logout');
  state.user = null;
  sessionStorage.removeItem('hr_session');
  document.getElementById('app').classList.remove('active');
  document.getElementById('login-view').style.display = 'flex';
  document.getElementById('login-form').reset();
}

  state.employees = await idbGetAll('employees');
  const users = await idbGetAll('users');

async function computeBadges(){
  const leave = await idbGetAll('leave');
  const tasks = await idbGetAll('tasks');
  let pending = leave.filter(l => l.status === 'pending');
  if (state.user.role === 'manager'){
    const team = teamMemberIds();
    pending = pending.filter(l => team.includes(l.employee_id));
  }
  let openTasks = tasks.filter(t => t.status !== 'done');
  if (state.user.role === 'manager') openTasks = openTasks.filter(t => t.assigned_to === state.user.id);
  // Training expired / expiring within 60 days (HR: everyone; manager: team)
  let trainingDue = 0;
  if (state.user.role !== 'employee'){
    const scope = state.user.role==='manager' ? teamMemberIds() : null;
    trainingDue = (await idbGetAll('training')).filter(r => (!scope || scope.includes(r.employee_id)) && isActiveEmp(r.employee_id) && ['expired','expiring'].includes(trainingStatus(r).key)).length;
  }
  // Pay documents the employee hasn't opened yet
  let newPayDocs = 0;
  if ((state.user.role === 'employee' || state.user.role === 'manager') && state.user.employee_id){
    newPayDocs = (await idbByIndex('pay_documents','employee_id',state.user.employee_id)).filter(d=>!d.viewed_at).length;
  }
  // One-to-one requests waiting for this person to accept/decline
  const oneToOneRequests = state.user.role==='employee' ? 0 : (await idbGetAll('one_to_ones')).filter(o=>o.status==='requested' && isOneToOneApprover(o)).length;
  // Policies this person still has to confirm as read & understood
  const docsToAck = state.user.employee_id ? (await outstandingAcks(state.user.employee_id)).length : 0;
  // Return-to-work interviews the user should hold
  const rtwDone = state.user.role==='employee' ? null : new Set((await idbGetAll('rtw')).map(r=>r.leave_id));
  const rtwDueN = rtwDone ? leave.filter(l => isRtwDue(l, rtwDone) && canManageEmp(l.employee_id)).length : 0;
  // Announcements published since this user last opened the board
  const newAnnouncements = (await visibleAnnouncements()).filter(a => isNewAnnouncement(a)).length;
  return {
    pendingHoliday: pending.filter(l=>l.type==='holiday').length + (state.user.role==='employee' ? 0 : leave.filter(l=>isCancelRequest(l) && canDecideCancel(l)).length),
    sicknessActions: pending.filter(l=>l.type==='sickness').length + rtwDueN,
    newAnnouncements,
    pendingOther: pending.filter(l=>OTHER_ABSENCE.includes(l.type)).length,
    openTasks: openTasks.length,
    trainingDue, newPayDocs, oneToOneRequests, docsToAck
  };
}

// Working days (Mon–Fri) inclusive, skipping company closed days (bank
// holidays and shutdown days) — those are never charged to a booking.
function workingDays(start, end, closed = state.closedDays){
  let d=new Date(start), e=new Date(end), n=0;
  if (isNaN(d)||isNaN(e)||e<d) return 0;
  while(d<=e){ const wd=d.getDay(); if(wd!==0&&wd!==6 && !closed.has(d.toISOString().slice(0,10))) n++; d.setDate(d.getDate()+1); }
  return n;
}
// Shutdown days that come out of holiday allowance for this employee in a holiday year
function deductingShutdownDays(e, bounds){
  if (!e) return [];
  return state.companyDays.filter(c => c.kind==='shutdown' && c.deducts && c.date>=bounds.start && c.date<=bounds.end
    && (!e.start_date || e.start_date<=c.date) && (!e.end_date || e.end_date>=c.date));
}

// Holiday year boundaries for a given date
async function holidayYearBounds(ref){
  const mmdd = await getSetting('holiday_year_start','01-01');
  const [mm,dd] = mmdd.split('-').map(Number);
  const r = ref?new Date(ref):new Date();
  let startYear = r.getFullYear();
  const boundary = new Date(startYear, mm-1, dd);
  if (r < boundary) startYear -= 1;
  const start = new Date(startYear, mm-1, dd);
  const end = new Date(startYear+1, mm-1, dd); end.setDate(end.getDate()-1);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10), label:`${startYear}/${String((startYear+1)).slice(2)}` };
}

async function leaveBalance(employeeId){
  const e = empById(employeeId);
  const allowance = e?.holiday_allowance ?? DEFAULT_ALLOWANCE;
  const bounds = await holidayYearBounds();
  const rows = await idbByIndex('leave','employee_id',employeeId);
  let booked=0, pending=0, adjustments=0;
  rows.forEach(l => {
    if (l.start_date < bounds.start || l.start_date > bounds.end) return;
    if (l.type==='adjustment'){ adjustments += Number(l.days)||0; return; }
    if (l.type!=='holiday') return;
    if (l.status==='approved') booked += l.days;
    else if (l.status==='pending') pending += l.days;
  });
  const entitlement = allowance + adjustments;
  // Shutdown days marked "uses holiday" are booked for everyone automatically.
  const shutdown = deductingShutdownDays(e, bounds).length;
  booked += shutdown;
  // Only BOOKED (approved) holiday is deducted from remaining; pending is shown
  // separately and does NOT reduce the balance until it's approved/booked.
  return { allowance, adjustments, entitlement, booked, shutdown, taken: booked, pending, remaining: entitlement - booked, bounds };
}

async function openHolidayList(empId, kind){
  const bounds = await holidayYearBounds();

  if (kind==='booked') list = list.concat(deductingShutdownDays(empById(empId), bounds).map(c=>({ start_date:c.date, end_date:c.date, days:1, reason:`${c.name} (company shutdown)` })));

}
// Length of service as "X years, Y months"
function serviceYM(start){
  if(!start) return '—';
  const s=new Date(start), n=new Date();
  if(isNaN(s)) return '—';
  let months=(n.getFullYear()-s.getFullYear())*12+(n.getMonth()-s.getMonth());
  if(n.getDate()<s.getDate()) months--;
  if(months<0) months=0;
  const y=Math.floor(months/12), m=months%12;
  const yPart = y>0?`${y} year${y!==1?'s':''}`:'';
  const mPart = `${m} month${m!==1?'s':''}`;
  return (y>0? yPart+', ':'') + mPart;
}

function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => {
    const s = c==null?'':String(c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  URL.revokeObjectURL(a.href);
}

// Drill-down list when a dashboard tile is clicked
async function openDashList(kind){
  const isMgr = state.user.role==='manager';
  const team = isMgr ? teamMemberIds() : null;
  const inScope = id => !team || team.includes(id);
  const bounds = await holidayYearBounds();
  const tableWrap = (cols, body, empty) => body ? `<div class="table-wrap"><table><thead><tr>${cols}</tr></thead><tbody>${body}</tbody></table></div>` : `<div class="empty small">${empty}</div>`;
  let title='', html='';
  if (kind==='active'){
    const list = state.employees.filter(e=>e.status==='active' && inScope(e.id)).sort((a,b)=>a.last_name.localeCompare(b.last_name));
    title = `Active employees (${list.length})`;
    html = tableWrap('<th>Name</th><th>Job title</th><th>Dept</th><th>Site</th>',
      list.map(e=>`<tr class="clickable" onclick="closeModal();employeeDetail('${e.id}')"><td>${esc(e.first_name+' '+e.last_name)}</td><td>${esc(e.job_title)}</td><td>${esc(e.department)}</td><td>${esc(e.site)}</td></tr>`).join(''), 'No active employees.');
  } else if (kind==='offtoday'){
    const list = (await idbGetAll('leave')).filter(l=>l.type!=='adjustment' && l.status==='approved' && l.start_date<=today() && l.end_date>=today() && inScope(l.employee_id)).sort((a,b)=>a.end_date.localeCompare(b.end_date));
    title = `Off today (${list.length})`;
    html = tableWrap('<th>Employee</th><th>Type</th><th>From</th><th>Back</th>',
      list.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td><td>${leaveBadge(l.type)}</td><td>${fmtDate(l.start_date)}</td><td>${fmtDate(addDays(l.end_date,1))}</td></tr>`).join(''), 'Everyone is in today.');
  } else if (kind==='pending'){
    const list = (await idbGetAll('leave')).filter(l=>l.status==='pending' && inScope(l.employee_id)).sort((a,b)=>a.start_date.localeCompare(b.start_date));
    title = `Leave to approve (${list.length})`;
    html = tableWrap('<th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th></th>',
      list.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td><td>${leaveBadge(l.type)}</td><td>${fmtDate(l.start_date)}</td><td>${fmtDate(l.end_date)}</td><td>${l.days}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-success btn-sm" onclick="closeModal();decideLeave('${l.id}','approved')">Approve</button> <button class="btn btn-danger btn-sm" onclick="closeModal();decideLeave('${l.id}','rejected')">Reject</button></td></tr>`).join(''), 'Nothing awaiting approval.');
    const cancels = (await idbGetAll('leave')).filter(l=>isCancelRequest(l) && canDecideCancel(l)).sort((a,b)=>a.start_date.localeCompare(b.start_date));
    if (cancels.length){
      title = `Leave to approve (${list.length + cancels.length})`;
      html += `<h4 style="margin:18px 0 8px">Holiday cancellation requests</h4>` + tableWrap('<th>Employee</th><th>Holiday</th><th>Days</th><th>Reason</th><th></th>',
        cancels.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td><td>${fmtDate(l.start_date)} – ${fmtDate(l.end_date)}</td><td>${l.days}</td><td class="small">${esc(l.cancel_reason)||'—'}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-success btn-sm" onclick="closeModal();decideCancellation('${l.id}',true)">Approve cancellation</button> <button class="btn btn-danger btn-sm" onclick="closeModal();decideCancellation('${l.id}',false)">Decline</button></td></tr>`).join(''), '');
    }
  } else if (kind==='sick'){
    const list = (await idbGetAll('leave')).filter(l=>l.type==='sickness' && l.status==='approved' && l.start_date>=bounds.start && l.start_date<=bounds.end && inScope(l.employee_id)).sort((a,b)=>b.start_date.localeCompare(a.start_date));
    const total = list.reduce((a,l)=>a+l.days,0);
    title = `Sickness — ${total} day${total!==1?'s':''} (${bounds.label})`;
    html = tableWrap('<th>Employee</th><th>From</th><th>To</th><th>Days</th><th>Reason</th>',
      list.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td><td>${fmtDate(l.start_date)}</td><td>${fmtDate(l.end_date)}</td><td>${l.days}</td><td class="small">${esc(l.reason)||'—'}</td></tr>`).join(''), 'No sickness recorded this year.');
  } else if (kind==='rtw'){
    const done = await rtwDoneSet();
    const list = (await idbGetAll('leave')).filter(l=>isRtwDue(l, done) && canManageEmp(l.employee_id)).sort((a,b)=>a.end_date.localeCompare(b.end_date));
    title = `Return-to-work interviews due (${list.length})`;
    html = tableWrap('<th>Employee</th><th>Off sick</th><th>Days</th><th>Reason</th><th></th>',
      list.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td><td>${fmtDate(l.start_date)}${l.end_date!==l.start_date?' – '+fmtDate(l.end_date):''}</td><td>${l.days}</td><td class="small">${esc(l.reason)||'—'}</td><td style="text-align:right"><button class="btn btn-accent btn-sm" onclick="closeModal();rtwForm('${l.id}')">Return to work</button></td></tr>`).join(''), `Nothing due — interviews are flagged for sickness that ended in the last ${RTW_DUE_WINDOW} days.`);
  } else if (kind==='probation'){
    const list = state.employees.filter(e=>e.status==='active' && inScope(e.id) && e.probation_end_date && e.probation_end_date<=addDays(today(),45)).sort((a,b)=>a.probation_end_date.localeCompare(b.probation_end_date));
    title = `Probation reviews due (${list.length})`;
    html = tableWrap('<th>Employee</th><th>Job title</th><th>Manager</th><th>Probation ends</th>',
      list.map(e=>`<tr class="clickable" onclick="closeModal();employeeDetail('${e.id}')"><td>${esc(e.first_name+' '+e.last_name)}</td><td>${esc(e.job_title)}</td><td>${e.manager_id?esc(empName(e.manager_id)):'—'}</td><td>${fmtDate(e.probation_end_date)} ${e.probation_end_date<today()?'<span class="badge b-red">Overdue</span>':'<span class="badge b-amber">Due soon</span>'}</td></tr>`).join(''), 'No probation reviews due.');
  } else if (kind==='training'){
    const list = (await idbGetAll('training')).filter(r => inScope(r.employee_id) && isActiveEmp(r.employee_id) && ['expired','expiring'].includes(trainingStatus(r).key)).sort((a,b)=>(a.expiry_date||'').localeCompare(b.expiry_date||''));
    title = `Training expiring / expired (${list.length})`;
    html = tableWrap('<th>Employee</th><th>Course</th><th>Expires</th><th>Status</th>',
      list.map(r=>`<tr class="clickable" onclick="closeModal();employeeDetail('${r.employee_id}')"><td>${esc(empName(r.employee_id))}</td><td>${esc(r.title)}</td><td>${fmtDate(r.expiry_date)}</td><td>${trainingStatusBadge(r)}</td></tr>`).join(''), 'Nothing expiring in the next 60 days.');
  } else if (kind==='tasks'){
    let list = (await idbGetAll('tasks')).filter(t=>t.status!=='done');
    if (isMgr) list = list.filter(t=>t.assigned_to===state.user.id);
    list.sort((a,b)=>(a.due_date||'').localeCompare(b.due_date||''));
    title = `Open tasks (${list.length})`;
    html = tableWrap('<th>Task</th><th>Related to</th><th>Due</th><th>Priority</th>',
      list.map(t=>`<tr><td>${esc(t.title)}${t.due_date&&t.due_date<today()?' <span class="badge b-red">Overdue</span>':''}</td><td>${t.related_employee_id?esc(empName(t.related_employee_id)):'—'}</td><td>${fmtDate(t.due_date)}</td><td>${priorityBadge(t.priority)}</td></tr>`).join(''), 'No open tasks.');
  }
  openModal(`<h2>${title}</h2><div style="margin-top:12px">${html}</div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>`, true);
}

async function renderEmployees(c, teamOnly){
  let emps = [...state.employees];
  if (teamOnly){ const team = teamMemberIds(); emps = emps.filter(e => team.includes(e.id)); }
  if (state.user.role === 'hr_admin') setTopbar(`<button class="btn btn-accent" onclick="employeeForm()">+ Add employee</button>`);
  window._allEmps = emps;
  c.innerHTML = `
    <div class="toolbar">
      <input class="grow" id="emp-search" placeholder="Search name, number, job title…" oninput="filterEmployees()">
      <select id="emp-site" onchange="filterEmployees()"><option value="">All sites</option>${SITES.map(s=>`<option>${s}</option>`).join('')}</select>
      <select id="emp-dept" onchange="filterEmployees()"><option value="">All departments</option>${DEPARTMENTS.map(s=>`<option>${s}</option>`).join('')}</select>
      <select id="emp-status" onchange="filterEmployees()"><option value="active">Active</option><option value="">All statuses</option><option value="leaver">Leavers</option><option value="on_leave">On leave</option></select>
    </div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th></th><th>Name</th><th>No.</th><th>Job title</th><th>Department</th><th>Site</th><th>Manager</th><th>Status</th></tr></thead>
      <tbody id="emp-tbody"></tbody>
    </table></div></div>`;
  filterEmployees();
}
function filterEmployees(){
  const q = (document.getElementById('emp-search')?.value||'').toLowerCase();
  const site = document.getElementById('emp-site')?.value||'';
  const dept = document.getElementById('emp-dept')?.value||'';
  const st = document.getElementById('emp-status')?.value;
  let rows = window._allEmps.filter(e => {
    if (site && e.site!==site) return false;
    if (dept && e.department!==dept) return false;
    if (st!=='' && st!==undefined && e.status!==st) return false;
    if (q){ const hay=`${e.first_name} ${e.last_name} ${e.employee_number} ${e.job_title}`.toLowerCase(); if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>`${a.last_name}`.localeCompare(b.last_name));
  const tb = document.getElementById('emp-tbody');
  tb.innerHTML = rows.length ? rows.map(e=>`
    <tr class="clickable" onclick="employeeDetail('${e.id}')">
      <td>${avatarHtml(e)}</td>
      <td><strong>${esc(e.first_name)} ${esc(e.last_name)}</strong></td>
      <td>${esc(e.employee_number)}</td>
      <td>${esc(e.job_title)}</td>
      <td>${esc(e.department)}</td>
      <td>${esc(e.site)}</td>
      <td>${e.manager_id?esc(empName(e.manager_id)):'—'}</td>
      <td>${statusBadge(e.status)}</td>
    </tr>`).join('') : `<tr><td colspan="8"><div class="empty">No employees match.</div></td></tr>`;
}

function empTab(tab, el){
  window._activeEmpTab = tab;
  document.querySelectorAll('#emp-tabs .tab').forEach(t=>t.classList.remove('active'));

  const id = window._detailEmp;
  const body = document.getElementById('emp-tab-body');
  ({
    personal: ()=>empTabPersonal(body,id),
    employment: ()=>empTabEmployment(body,id),
    jobs: ()=>empTabJobs(body,id),
    contacts: ()=>empTabContacts(body,id),
    leave: ()=>empTabLeave(body,id),
    sickness: ()=>empTabSickness(body,id),
    other: ()=>empTabOther(body,id),
    performance: ()=>empTabPerformance(body,id),
    training: ()=>empTabTraining(body,id),
    documents: ()=>empTabDocuments(body,id),
    payslips: ()=>empTabPayDocs(body,id)
  })[tab]();
}

async function saveEmployee(ev, id){
  ev.preventDefault();
  const existing = id ? empById(id) : null;
  let photo = existing?.photo || null;
  const fileEl = document.getElementById('f-photo');
  if (fileEl.files[0]) photo = await fileToDataURL(fileEl.files[0]);
  const rec = {
    id: id || uuid(),
    title: val('f-title'),
    employee_number: val('f-num'), first_name: val('f-fn'), last_name: val('f-ln'),
    preferred_name: existing?.preferred_name||'',
    date_of_birth: val('f-dob'), gender: val('f-gender'), ni_number: val('f-ni'),
    address_line1: val('f-a1'), address_line2: val('f-a2'), city: val('f-city'), postcode: val('f-pc'),
    personal_email: val('f-pe'), work_email: val('f-we'), mobile_phone: val('f-mob'), home_phone: existing?.home_phone||'',
    work_phone: val('f-wp'), work_mobile: val('f-wm'), is_director: val('f-dir')==='yes',
    job_title: val('f-jt'), department: val('f-dept'), site: val('f-site'),
    manager_id: val('f-mgr')||null, employment_type: val('f-type'),
    working_hours: numVal('f-hours'), notice_period: val('f-notice'),
    start_date: val('f-start'), end_date: val('f-end')||null, probation_end_date: val('f-prob')||null, status: val('f-status'),
    salary: numVal('f-sal'), pay_frequency: existing?.pay_frequency||'Annual',
    bank_sort_code: val('f-sort'), bank_account: val('f-acct'),
    holiday_allowance: numVal('f-hol') ?? DEFAULT_ALLOWANCE,
    photo, notes: val('f-notes'),
    created_at: existing?.created_at || nowISO(), updated_at: nowISO()
  };
  const roleChange = existing && roleChanged(existing, rec);
  await idbPut('employees', rec);
  // A new starter's first role opens their job history.
  if (!existing) await idbPut('jobs', { id:uuid(), employee_id:rec.id, ...roleOf(rec), start_date:rec.start_date||today(), end_date:null, reason:'Joined', notes:'', created_at:nowISO() });
  // Record which fields changed (names only, so salary/bank values stay out of the log)
  const changes = existing ? Object.keys(rec).filter(k => !['updated_at','created_at'].includes(k) && JSON.stringify(existing[k]??'') !== JSON.stringify(rec[k]??'')).map(k=>k.replace(/_/g,' ')).join(', ') : '';
  await logAction(id?'employee_update':'employee_create', { employee_id: rec.id, ...(changes?{changes}:{}) });
  await refreshCaches();
  closeModal();
  toast(id?'Employee updated':'Employee added');
  if (state.page==='employees'||state.page==='team') await navigate(state.page);
  else await employeeDetail(rec.id);
  if (roleChange) jobChangePrompt(rec.id, existing);
}
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

const JOB_CHANGE_REASONS = ['Joined','Promotion','Role change','Transfer','Restructure','Contract change','Other'];

// A previously blank field being filled in isn't a role change.
const roleChanged = (a, b) => ['job_title','department','site','employment_type'].some(k => a[k] && a[k] !== (b[k]||''));
async function jobsFor(empId){ return (await idbByIndex('jobs','employee_id',empId)).sort((a,b)=>(b.start_date||'').localeCompare(a.start_date||'')); }
function jobHistoryTable(e, jobs, canEdit){

function jobChangePrompt(empId, before){
  const e = empById(empId); if (!e) return;
  window._jobChangeBefore = roleOf(before);
  const desc = r => [r.job_title, r.department, r.site, r.employment_type].filter(Boolean).map(esc).join(' · ');

async function saveJobChange(ev, empId){
  ev.preventDefault();
  const e = empById(empId), eff = val('jc-date');
  if (!e || !eff) return;
  const jobs = await jobsFor(empId);
  // First change for someone with no history: record the role they're leaving.
  if (!jobs.length && window._jobChangeBefore && (!e.start_date || e.start_date < eff))
    await idbPut('jobs', { id:uuid(), employee_id:empId, ...window._jobChangeBefore, start_date:e.start_date||null, end_date:addDays(eff,-1), reason:'Joined', notes:'', created_at:nowISO() });
  for (const j of jobs.filter(j=>!j.end_date && (!j.start_date || j.start_date < eff))){ j.end_date = addDays(eff,-1); await idbPut('jobs', j); }
  await idbPut('jobs', { id:uuid(), employee_id:empId, ...roleOf(e), start_date:eff, end_date:null, reason:val('jc-reason'), notes:val('jc-notes'), created_at:nowISO() });
  await logAction('job_history_change', { employee_id: empId });
  closeModal(); toast('Added to job history');
  if (window._detailEmp===empId){ const t=[...document.querySelectorAll('#emp-tabs .tab')].find(x=>x.textContent.trim()==='Job history'); if (t) empTab('jobs', t); }
}

async function renderLeave(c, category){
  category = category || 'holiday';
  const isMgr = state.user.role==='manager';
  const scope = isMgr ? teamMemberIds() : null;
  const inCat = l => category==='other' ? OTHER_ABSENCE.includes(l.type) : l.type===category;
  let leave = (await idbGetAll('leave')).filter(inCat);
  if (scope) leave = leave.filter(l => scope.includes(l.employee_id));
  const pending = leave.filter(l=>l.status==='pending').sort((a,b)=>a.start_date.localeCompare(b.start_date));
  const cancelReqs = leave.filter(l=>isCancelRequest(l) && canDecideCancel(l)).sort((a,b)=>a.start_date.localeCompare(b.start_date));
  const records = leave.filter(l=>l.status!=='pending').sort((a,b)=>b.start_date.localeCompare(a.start_date));
  const meta = {
    holiday:  { recTitle:'Holiday bookings',       recBtn:'+ Record holiday',  preset:'holiday' },
    sickness: { recTitle:'Sickness records',       recBtn:'+ Record sickness', preset:'sickness' },
    other:    { recTitle:'Other absence records',  recBtn:'+ Record absence',  preset:'unpaid' }
  }[category];
  const showType = category==='other';
  if (state.user.role==='hr_admin' || isMgr) setTopbar(`<button class="btn btn-accent" onclick="leaveForm(null,false,'${meta.preset}')">${meta.recBtn}</button>`);
  const typeCol = showType ? '<th>Type</th>' : '';
  const typeCell = l => showType ? `<td>${leaveBadge(l.type)}</td>` : '';
  // Sickness: return-to-work interviews and Bradford Factor
  const isSick = category==='sickness';
  const rtwDone = isSick ? await rtwDoneSet() : null;
  const rtwDue = isSick ? leave.filter(l=>isRtwDue(l, rtwDone) && canManageEmp(l.employee_id)).sort((a,b)=>a.end_date.localeCompare(b.end_date)) : [];
  const rtwCol = isSick ? '<th>Return to work</th>' : '';
  const rtwTd = l => isSick ? `<td style="white-space:nowrap">${rtwCell(l, rtwDone)}</td>` : '';
  let sickExtra = '';
  if (isSick){
    const people = state.employees.filter(e => e.status!=='leaver' && (!scope || scope.includes(e.id)));
    sickExtra = `<div class="card"><div class="card-head"><h3>Return-to-work interviews due (${rtwDue.length})</h3></div>
      ${rtwDue.length?`<div class="table-wrap"><table><thead><tr><th>Employee</th><th>Off sick</th><th>Days</th><th>Reason</th><th></th></tr></thead><tbody>${
        rtwDue.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td><td>${fmtDate(l.start_date)}${l.end_date!==l.start_date?' – '+fmtDate(l.end_date):''}</td><td>${l.days}</td><td class="small">${esc(l.reason)||'—'}</td><td style="text-align:right"><button class="btn btn-accent btn-sm" onclick="rtwForm('${l.id}')">Return to work</button></td></tr>`).join('')
      }</tbody></table></div>`:`<div class="empty small">All caught up. Interviews are flagged for sickness that ended in the last ${RTW_DUE_WINDOW} days.</div>`}
    </div>` + bradfordTableHtml(people, leave);
  }
  c.innerHTML = `
    <div class="card">
      <div class="card-head"><h3>Awaiting approval (${pending.length})</h3></div>
      ${pending.length?`<div class="table-wrap"><table><thead><tr><th>Employee</th>${typeCol}<th>From</th><th>To</th><th>Days</th><th>Reason</th><th></th></tr></thead><tbody>${
        pending.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td>${typeCell(l)}<td>${fmtDate(l.start_date)}</td><td>${fmtDate(l.end_date)}</td><td>${l.days}</td><td class="small">${esc(l.reason)||'—'}</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-success btn-sm" onclick="decideLeave('${l.id}','approved')">Approve</button> <button class="btn btn-danger btn-sm" onclick="decideLeave('${l.id}','rejected')">Reject</button></td></tr>`).join('')
      }</tbody></table></div>`:'<div class="empty small">Nothing awaiting approval.</div>'}
    </div>
    ${category==='holiday'?`<div class="card">
      <div class="card-head"><h3>Cancellation requests (${cancelReqs.length})</h3></div>
      ${cancelReqs.length?`<p class="small muted" style="margin-bottom:10px">Approved holidays the employee has asked to cancel. They stay booked until you approve the cancellation.</p><div class="table-wrap"><table><thead><tr><th>Employee</th><th>From</th><th>To</th><th>Days</th><th>Requested</th><th>Reason</th><th></th></tr></thead><tbody>${
        cancelReqs.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td><td>${fmtDate(l.start_date)}</td><td>${fmtDate(l.end_date)}</td><td>${l.days}</td><td class="small">${fmtDate(l.cancel_requested_at)}</td><td class="small">${esc(l.cancel_reason)||'—'}</td><td style="text-align:right;white-space:nowrap">${cancelDecisionButtons(l)}</td></tr>`).join('')
      }</tbody></table></div>`:'<div class="empty small">No cancellation requests.</div>'}
    </div>`:''}
    ${sickExtra}
    <div class="card">
      <div class="card-head"><h3>${meta.recTitle}</h3></div>
      ${records.length?`<div class="table-wrap"><table><thead><tr><th>Employee</th>${typeCol}<th>From</th><th>To</th><th>Days</th><th>Status</th><th>Reason</th>${rtwCol}</tr></thead><tbody>${
        records.map(l=>`<tr><td>${esc(empName(l.employee_id))}</td>${typeCell(l)}<td>${fmtDate(l.start_date)}</td><td>${fmtDate(l.end_date)}</td><td>${l.days}</td><td>${leaveStatusCell(l)}</td><td class="small">${esc(l.reason)||'—'}</td>${rtwTd(l)}</tr>`).join('')
      }</tbody></table></div>`:'<div class="empty small">No records.</div>'}

}

// ── Cancellation of approved, not-yet-started holiday ──
// The booking stays "approved" (and counts against the balance) until the
// approver accepts the cancellation; then it becomes "cancelled" and the days
// return to the employee's balance.
const canRequestCancel = l => l.type==='holiday' && l.status==='approved' && l.start_date > today() && !l.cancel_requested;
const isCancelRequest = l => l.type==='holiday' && l.status==='approved' && !!l.cancel_requested;
function leaveStatusCell(l){
  if (isCancelRequest(l)) return leaveStatusBadge(l.status)+' <span class="badge b-amber">Cancellation requested</span>';
  if (l.status==='approved' && l.cancel_outcome==='declined') return leaveStatusBadge(l.status)+' <span class="badge b-grey">Cancellation declined</span>';
  return leaveStatusBadge(l.status);
}
// Approver: HR admin, or the employee's manager — never the employee themself.
function canDecideCancel(l){
  if (l.employee_id===state.user.employee_id) return false;
  return state.user.role==='hr_admin' || (state.user.role==='manager' && teamMemberIds().includes(l.employee_id));
}
function cancelDecisionButtons(l){
  return canDecideCancel(l) ? `<button class="btn btn-success btn-sm" onclick="decideCancellation('${l.id}',true)">Approve cancellation</button> <button class="btn btn-danger btn-sm" onclick="decideCancellation('${l.id}',false)">Decline</button>` : '';
}
async function cancelRequestForm(id){
  const l = await idbGet('leave', id);
  if (!l || l.employee_id!==state.user.employee_id || !canRequestCancel(l)){ toast('This holiday can no longer be cancelled','error'); return; }
  openModal(`<h2>Request cancellation</h2><div class="modal-sub">Holiday ${fmtDate(l.start_date)} – ${fmtDate(l.end_date)} · ${l.days} day${l.days!==1?'s':''}</div>
    <form onsubmit="submitCancelRequest(event,'${id}')">
      <p class="small muted" style="margin-bottom:12px">Your manager needs to approve this. The holiday stays booked until they do; once approved, the days go back into your balance.</p>
      <div class="form-group"><label>Reason (optional)</label><textarea id="cr-reason" rows="2" placeholder="e.g. Plans changed"></textarea></div>
      <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Keep holiday</button><button type="submit" class="btn btn-primary">Send request</button></div>
    </form>`);
}
async function submitCancelRequest(ev, id){
  ev.preventDefault();
  const l = await idbGet('leave', id);
  if (!l || l.employee_id!==state.user.employee_id || !canRequestCancel(l)){ toast('This holiday can no longer be cancelled','error'); closeModal(); return; }
  Object.assign(l, { cancel_requested:true, cancel_requested_at:nowISO(), cancel_reason:val('cr-reason'), cancel_outcome:null });
  await idbPut('leave', l);
  await logAction('holiday_cancel_requested', { employee_id:l.employee_id, leave_id:id });
  closeModal(); toast('Cancellation request sent for approval');
  refreshLeaveViews();
}
async function withdrawCancelRequest(id){
  const l = await idbGet('leave', id);
  if (!l || l.employee_id!==state.user.employee_id || !isCancelRequest(l)) return;
  if (!confirm('Withdraw your cancellation request? The holiday will stay booked.')) return;
  Object.assign(l, { cancel_requested:false, cancel_requested_at:null, cancel_reason:'' });
  await idbPut('leave', l);
  await logAction('holiday_cancel_withdrawn', { employee_id:l.employee_id, leave_id:id });
  toast('Cancellation request withdrawn'); refreshLeaveViews();
}
async function decideCancellation(id, approve){
  const l = await idbGet('leave', id);
  if (!l || !isCancelRequest(l)){ toast('No cancellation request found','error'); refreshLeaveViews(); return; }
  if (!canDecideCancel(l)){ toast('Not permitted','error'); return; }
  if (approve && l.start_date <= today() && !confirm('This holiday has already started. Cancel it anyway?')) return;
  Object.assign(l, { cancel_requested:false, cancel_outcome: approve?'approved':'declined', cancel_decided_by: state.user.username, cancel_decided_at: nowISO() });
  if (approve) l.status = 'cancelled';
  await idbPut('leave', l);
  await logAction(approve?'holiday_cancel_approved':'holiday_cancel_declined', { employee_id:l.employee_id, leave_id:id });
  toast(approve ? 'Cancellation approved — days returned to balance' : 'Cancellation declined — holiday stays booked');
  refreshLeaveViews();
}

const MAX_UPLOAD_BYTES = 15 * 1024 * 1024;
function dataURLtoBlob(dataUrl){
  const [head, b64] = dataUrl.split(',');
  const mime = (head.match(/data:([^;]+)/)||[])[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
// View a stored file {data, filename} in a new tab, or download it.
function openStoredFile(file, download){
  if (!file || !file.data){ toast('No file attached','error'); return; }
  const url = URL.createObjectURL(dataURLtoBlob(file.data));
  const save = () => { const a=document.createElement('a'); a.href=url; a.download=file.filename||'document'; a.click(); };
  if (download) save(); else if (!window.open(url, '_blank')) save();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function monthLabel(ym){ if(!ym || !/^\d{4}-\d{2}$/.test(ym)) return ym||'—'; const [y,m]=ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'}); }

function recentTaxYearLabels(n=5){ const d=new Date(); let y=d.getFullYear(); if (d < new Date(y,3,6)) y--; return Array.from({length:n},(_,i)=>`${y-i}/${String(y-i+1).slice(2)}`); }

async function saveTraining(ev, id, presetEmp){
  ev.preventDefault();
  const existing = id ? await idbGet('training', id) : null;
  const empId = existing ? existing.employee_id : (presetEmp || val('trf-emp'));
  if (!empId){ toast('Select an employee','error'); return; }
  if (!canViewTrainingFor(empId)){ toast('Not permitted','error'); return; }
  const done = val('trf-done'), exp = val('trf-exp');
  if (exp && done && exp < done){ toast('Expiry date is before the completion date','error'); return; }
  let file = existing?.file || null;
  const f = document.getElementById('trf-file').files[0];
  if (f){
    if (f.size > MAX_UPLOAD_BYTES){ toast('File is too large (max 15 MB)','error'); return; }
    file = { filename:f.name, mime_type:f.type, data: await fileToDataURL(f) };
  }
  await idbPut('training', { id: id||uuid(), employee_id: empId, title: val('trf-title'), category: val('trf-cat'), provider: val('trf-provider'), completed_date: done, expiry_date: exp||null, notes: val('trf-notes'), file, added_by: existing?.added_by || state.user.username, created_at: existing?.created_at || nowISO(), updated_at: nowISO() });
  await logAction(id?'training_update':'training_create', { employee_id: empId });
  closeModal(); toast('Training record saved');
  if (window._detailEmp && refreshEmpTab()) return;
  navigate(state.page);
}
async function deleteTraining(id){
  const r = await idbGet('training', id);
  if (!r || !canEditTraining(r)) return;
  if (!confirm(`Delete the training record "${r.title}"?`)) return;
  await idbDelete('training', id);
  await logAction('training_delete', { employee_id: r.employee_id });
  toast('Deleted');
  if (window._detailEmp && refreshEmpTab()) return;
  navigate(state.page);
}
async function openTrainingCert(id){
  const r = await idbGet('training', id);
  if (!r || !canViewTrainingFor(r.employee_id)){ toast('Not permitted','error'); return; }
  openStoredFile(r.file, false);
}
function exportTraining(){
  const rows = [['Employee','Employee no.','Course','Category','Provider','Completed','Expires','Status']];

// ═══════════════════════════════════════════════
// PAYSLIPS, P60s & P11Ds (uploaded documents)
// HR admin uploads; the employee sees their own under "My Payslips".
// Managers never see another person's pay documents.
// ═══════════════════════════════════════════════
const PAY_DOC_TYPES = { payslip:'Payslip', p60:'P60', p11d:'P11D', other:'Other' };
const PAY_DOC_PLURAL = { payslip:'Payslips', p60:'P60s', p11d:'P11Ds', other:'Other pay documents' };
const isMonthlyPayDoc = t => t==='payslip' || t==='other';   // P60/P11D are per tax year
function payDocPeriodLabel(d){ return isMonthlyPayDoc(d.doc_type) ? monthLabel(d.period) : ('Tax year '+(d.tax_year||'—')); }
// Same employee + type + month/tax year → a re-upload replaces it ('other' never replaces).
function samePaySlot(a,b){ return a.doc_type!=='other' && a.employee_id===b.employee_id && a.doc_type===b.doc_type && (a.period||null)===(b.period||null) && (a.tax_year||null)===(b.tax_year||null); }
function payDocTypeFields(prefix){
  const ty = recentTaxYearLabels();
  return `<div class="form-row-3">
    <div class="form-group"><label>Document type</label><select id="${prefix}-type" onchange="payDocTypeChanged('${prefix}')">${Object.entries(PAY_DOC_TYPES).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    <div class="form-group" id="${prefix}-period-wrap"><label>Pay month</label><input id="${prefix}-period" type="month" value="${today().slice(0,7)}" placeholder="YYYY-MM" onchange="payDocTypeChanged('${prefix}')"></div>
    <div class="form-group" id="${prefix}-ty-wrap" style="display:none"><label>Tax year</label><select id="${prefix}-ty" onchange="payDocTypeChanged('${prefix}')">${ty.map((y,i)=>`<option ${i===1?'selected':''}>${y}</option>`).join('')}</select></div>
  </div>`;
}
function payDocTypeChanged(prefix){
  const monthly = isMonthlyPayDoc(val(prefix+'-type'));
  document.getElementById(prefix+'-period-wrap').style.display = monthly ? '' : 'none';
  document.getElementById(prefix+'-ty-wrap').style.display = monthly ? 'none' : '';
  if (prefix==='bu') renderBulkMap();
}
// Validates the slot inputs; returns { type, period, tax_year } or null.
function readPaySlot(prefix){
  const type = val(prefix+'-type');
  if (isMonthlyPayDoc(type)){
    const period = val(prefix+'-period');
    if (!/^\d{4}-\d{2}$/.test(period)){ toast('Enter the pay month as YYYY-MM','error'); return null; }
    return { type, period, tax_year:null };
  }
  return { type, period:null, tax_year: val(prefix+'-ty') };
}
async function makePayDoc(empId, file, slot){
  return { id:uuid(), employee_id:empId, doc_type:slot.type, period:slot.period, tax_year:slot.tax_year, filename:file.name, mime_type:file.type, data: await fileToDataURL(file), uploaded_by: state.user.username, uploaded_at: nowISO(), viewed_at:null };
}
function payDocRow(d, admin){
  const isNew = !admin && !d.viewed_at;
  return `<div class="doc-row"><div class="dic">${docIcon(d.mime_type)}</div><div class="di"><div class="t">${esc(payDocPeriodLabel(d))} <span class="badge b-grey">${PAY_DOC_TYPES[d.doc_type]||esc(d.doc_type)}</span>${isNew?' <span class="badge b-yellow">New</span>':''}</div><div class="small muted">${esc(d.filename)} · uploaded ${fmtDate(d.uploaded_at)}${admin?(d.viewed_at?' · opened by employee '+fmtDate(d.viewed_at):' · not yet opened by employee'):''}</div></div>
    <button class="btn btn-outline btn-sm" onclick="openPayDoc('${d.id}',false)">View</button> <button class="btn btn-outline btn-sm" onclick="openPayDoc('${d.id}',true)">Download</button>${admin?` <button class="btn btn-danger btn-sm" onclick="deletePayDoc('${d.id}')">×</button>`:''}</div>`;
}
function payDocGroups(docs, admin){
  if (!docs.length) return '<div class="empty small">No documents uploaded yet.</div>';
  return ['payslip','p60','p11d','other'].map(t => {
    const list = docs.filter(d=>d.doc_type===t).sort((a,b)=> isMonthlyPayDoc(t) ? (b.period||'').localeCompare(a.period||'') : (b.tax_year||'').localeCompare(a.tax_year||''));
    return list.length ? `<h4 style="margin:14px 0 8px">${PAY_DOC_PLURAL[t]}</h4>${list.map(d=>payDocRow(d,admin)).join('')}` : '';
  }).join('');
}
// Own pay documents (employee + manager logins). Always scoped to the
// signed-in person's own employee record — never anyone else's.

function payDocForm(empId){
  openModal(`<h2>Upload pay document</h2><div class="modal-sub">${esc(empName(empId))}</div>
    <form onsubmit="savePayDoc(event,'${empId}')">
      ${payDocTypeFields('pdf')}
      <div class="form-group"><label class="req">File</label><input id="pdf-file" type="file" accept=".pdf,image/*" required></div>
      <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Upload</button></div>
    </form>`);

async function savePayDoc(ev, empId){
  ev.preventDefault();
  if (state.user.role!=='hr_admin') return;
  const f = document.getElementById('pdf-file').files[0]; if (!f) return;
  if (f.size > MAX_UPLOAD_BYTES){ toast('File is too large (max 15 MB)','error'); return; }
  const slot = readPaySlot('pdf'); if (!slot) return;
  const rec = await makePayDoc(empId, f, slot);
  const clash = (await idbByIndex('pay_documents','employee_id',empId)).filter(d=>samePaySlot(d,rec));
  if (clash.length && !confirm(`A ${PAY_DOC_TYPES[slot.type]} for ${payDocPeriodLabel(rec)} already exists. Replace it?`)) return;
  for (const d of clash) await idbDelete('pay_documents', d.id);
  await idbPut('pay_documents', rec);
  await logAction('pay_document_upload', { employee_id: empId });
  closeModal(); toast('Uploaded');
  if (window._detailEmp && refreshEmpTab()) return;
  navigate(state.page);
}
async function openPayDoc(id, download){
  const d = await idbGet('pay_documents', id);
  if (!d) return;
  // Owner only (employee or manager opening their OWN document) — or HR admin.
  const own = !!state.user.employee_id && d.employee_id===state.user.employee_id;
  if (state.user.role!=='hr_admin' && !own){ toast('Not permitted','error'); return; }
  openStoredFile(d, download);
  await logAction('pay_document_open', { employee_id: d.employee_id });
  if (own && !d.viewed_at){ d.viewed_at = nowISO(); await idbPut('pay_documents', d); if (state.page==='my-payslips') navigate('my-payslips'); }
}
async function deletePayDoc(id){
  if (state.user.role!=='hr_admin') return;
  const d = await idbGet('pay_documents', id); if (!d) return;
  if (!confirm(`Delete ${PAY_DOC_TYPES[d.doc_type]} (${payDocPeriodLabel(d)}) for ${empName(d.employee_id)}?`)) return;
  await idbDelete('pay_documents', id);
  await logAction('pay_document_delete', { employee_id: d.employee_id });
  toast('Deleted');
  if (window._detailEmp && refreshEmpTab()) return;
  navigate(state.page);
}

    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>`, true);
}
// Match a file name to an employee: employee number first, then full name, then a unique surname.
function matchEmployeeForFile(name){
  const norm = s => (s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  const n = norm(name.replace(/\.[^.]+$/,''));
  const emps = state.employees.slice().sort((a,b)=>(b.employee_number||'').length-(a.employee_number||'').length);
  let hit = emps.find(e => e.employee_number && norm(e.employee_number).length>2 && n.includes(norm(e.employee_number)));
  if (!hit) hit = emps.find(e => n.includes(norm(e.first_name+e.last_name)) || n.includes(norm(e.last_name+e.first_name)));
  if (!hit){ const bySurname = emps.filter(e => (e.last_name||'').length>2 && n.includes(norm(e.last_name))); if (bySurname.length===1) hit = bySurname[0]; }
  return hit ? hit.id : '';
}
function bulkFilesChosen(){
  window._bulkPay = [...document.getElementById('bu-files').files].map(f => ({ file:f, empId: matchEmployeeForFile(f.name) }));
  renderBulkMap();
}
async function renderBulkMap(){
  const wrap = document.getElementById('bu-map'); if (!wrap) return;
  const rows = window._bulkPay || [];
  if (!rows.length){ wrap.innerHTML=''; return; }
  const type = val('bu-type');
  const slot = { doc_type:type, period: isMonthlyPayDoc(type)?val('bu-period'):null, tax_year: isMonthlyPayDoc(type)?null:val('bu-ty') };
  const existing = await idbGetAll('pay_documents');
  const emps = state.employees.slice().sort((a,b)=>a.last_name.localeCompare(b.last_name));
  const counts = {}; rows.forEach(r=>{ if (r.empId) counts[r.empId]=(counts[r.empId]||0)+1; });
  const matched = rows.filter(r=>r.empId).length;
  const dupes = Object.values(counts).some(n=>n>1);
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>File</th><th>Employee</th><th>Status</th></tr></thead><tbody>${rows.map((r,i)=>{
      const big = r.file.size > MAX_UPLOAD_BYTES;
      const replaces = r.empId && existing.some(d=>samePaySlot(d, { ...slot, employee_id:r.empId }));
      const status = big ? '<span class="badge b-red">Too large</span>' : !r.empId ? '<span class="badge b-grey">Not matched — skipped</span>' : counts[r.empId]>1 ? '<span class="badge b-red">Duplicate employee</span>' : replaces ? '<span class="badge b-amber">Replaces existing</span>' : '<span class="badge b-green">Ready</span>';
      return `<tr><td class="small" style="overflow-wrap:anywhere">${esc(r.file.name)}</td><td><select style="padding:6px;border:2px solid var(--border);border-radius:6px;max-width:260px" onchange="window._bulkPay[${i}].empId=this.value;renderBulkMap()"><option value="">— skip —</option>${emps.map(e=>`<option value="${e.id}" ${r.empId===e.id?'selected':''}>${esc(e.last_name+', '+e.first_name)}${e.employee_number?' ('+esc(e.employee_number)+')':''}</option>`).join('')}</select></td><td>${status}</td></tr>`; }).join('')}</tbody></table></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap"><span class="small muted">${matched} of ${rows.length} file${rows.length!==1?'s':''} matched${dupes?' · <span style="color:var(--danger)">two files point at the same employee</span>':''}</span><button class="btn btn-primary" onclick="saveBulkPayDocs()" ${matched&&!dupes?'':'disabled'}>Upload ${matched} document${matched!==1?'s':''}</button></div>`;
}
async function saveBulkPayDocs(){
  if (state.user.role!=='hr_admin') return;
  const rows = (window._bulkPay||[]).filter(r=>r.empId);
  if (new Set(rows.map(r=>r.empId)).size !== rows.length){ toast('Two files are matched to the same employee — fix or skip one','error'); return; }
  const tooBig = rows.find(r=>r.file.size > MAX_UPLOAD_BYTES);
  if (tooBig){ toast(`${tooBig.file.name} is too large (max 15 MB) — skip it`,'error'); return; }
  const slot = readPaySlot('bu'); if (!slot) return;
  const existing = await idbGetAll('pay_documents');
  for (const r of rows){
    const rec = await makePayDoc(r.empId, r.file, slot);
    for (const d of existing.filter(d=>samePaySlot(d,rec))) await idbDelete('pay_documents', d.id);
    await idbPut('pay_documents', rec);
  }
  await logAction('pay_documents_bulk_upload', { detail: `${rows.length} × ${PAY_DOC_TYPES[slot.type]}` });
  window._bulkPay = [];
  toast(`Uploaded ${rows.length} document${rows.length!==1?'s':''}`);
  navigate('payslip-uploads');
}

async function renderOrgChart(c){
  const people = state.employees.filter(e => e.status !== 'leaver');
  const ids = new Set(people.map(e=>e.id));
  const kids = {};
  people.forEach(e => { const m = (e.manager_id && ids.has(e.manager_id) && e.manager_id!==e.id) ? e.manager_id : '_root'; (kids[m] = kids[m]||[]).push(e); });
  Object.values(kids).forEach(l => l.sort((a,b)=>(a.last_name||'').localeCompare(b.last_name||'')));
  const seen = new Set();   // guards against circular manager links
  const node = e => {
    if (seen.has(e.id)) return '';

    const reports = (kids[e.id]||[]).filter(r=>!seen.has(r.id));
    return `<li>${orgNodeHtml(e, (kids[e.id]||[]).length)}${reports.length?`<ul>${reports.map(node).join('')}</ul>`:''}</li>`;
  };

  c.innerHTML = `
    <div class="toolbar">
      <div class="pill-tabs" id="org-view" style="margin:0"><div class="pill active" onclick="orgView('chart',this)">Chart</div><div class="pill" onclick="orgView('dept',this)">By department</div></div>

    <div id="org-dept-card" style="display:none">${orgDeptHtml(people)}</div>`;
}

// Company documents with ack=1 must be confirmed by every current employee.
// One doc_acks row per person per document (id = docId:employeeId).
const ackKey = (docId, empId) => `${docId}:${empId}`;
const isTrackedDoc = d => !d.employee_id && d.ack === 1;
async function trackedDocs(){ return (await idbByIndex('documents','ack',1)).filter(isTrackedDoc); }
async function outstandingAcks(empId){
  const e = empById(empId); if (!e || e.status==='leaver') return [];
  const docs = await trackedDocs(); if (!docs.length) return [];
  const done = new Set((await idbByIndex('doc_acks','employee_id',empId)).map(a=>a.document_id));
  return docs.filter(d=>!done.has(d.id));
}
function ackDueBadge(d){
  if (!d.ack_deadline) return '<span class="badge b-amber">To confirm</span>';
  return d.ack_deadline < today() ? `<span class="badge b-red">Overdue · was due ${fmtDate(d.ack_deadline)}</span>` : `<span class="badge b-amber">Confirm by ${fmtDate(d.ack_deadline)}</span>`;
}
// People the viewer can see confirmation status for: HR everyone, managers their team (and themself).
function ackAudience(){
  const all = state.employees.filter(e=>e.status!=='leaver');
  if (state.user.role==='hr_admin') return all;
  if (state.user.role==='manager'){ const t = teamMemberIds(); return all.filter(e=>t.includes(e.id) || e.id===state.user.employee_id); }
  return [];
}
async function ackCounts(docs){
  const people = ackAudience(), ids = new Set(people.map(e=>e.id));
  const acks = await idbGetAll('doc_acks');
  const out = {};
  docs.forEach(d => { const done = acks.filter(a=>a.document_id===d.id && ids.has(a.employee_id)).length; out[d.id] = { done, total: people.length }; });
  return out;
}
function applyAckFields(rec){
  if (document.getElementById('dc-ack')?.checked){ rec.ack = 1; rec.ack_deadline = val('dc-ackdate') || null; }
  else { delete rec.ack; rec.ack_deadline = null; }
}
async function ackForm(docId){
  const d = await idbGet('documents', docId);

  openModal(`<h2>Read &amp; understood</h2><div class="modal-sub">${esc(d.title)}${d.ack_deadline?` · confirm by ${fmtDate(d.ack_deadline)}`:''}</div>
    <form onsubmit="saveAck(event,'${docId}')">

      <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button><button type="submit" class="btn btn-primary">Confirm</button></div>

async function saveAck(ev, docId){

async function ackStatus(docId){
  const d = await idbGet('documents', docId); if (!d) return;

    <div class="toolbar">
